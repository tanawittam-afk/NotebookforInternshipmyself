<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Second Brain · Internship Notebook</title>
<meta name="description" content="A minimalist second-brain notebook for an internship: calendar, Work / Study / Ideas notes, pending tasks, search and #tags." />
<meta name="theme-color" content="#F6F3EA" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235E7043'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23F6F3EA' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23F6F3EA'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   Design tokens — cream background, sage / olive accents
   ============================================================ */
:root {
  --bg: #F6F3EA;
  --surface: #FFFDF7;
  --surface-2: #F0ECE0;
  --surface-3: #E9E4D6;
  --border: #E3DDCC;
  --border-strong: #CFC8B3;
  --text: #2E3229;
  --muted: #6B6F60;
  --faint: #A3A596;

  --accent: #5E7043;          /* olive — buttons, active tab (AA on white) */
  --accent-hover: #4E5E37;
  --sage: #8FA06F;            /* decorative — dots, highlights */
  --accent-soft: #E3E9D3;
  --accent-softer: #EFF2E5;

  --danger: #A34A35;
  --danger-soft: #F5E2DB;
  --warn: #8F6516;
  --warn-soft: #F4E9CF;

  --study: #7A6420;  --study-soft: #F1EBD3;
  --ideas: #3E6656;  --ideas-soft: #DDE9E2;

  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(46,50,41,.05), 0 6px 20px rgba(46,50,41,.06);
  --shadow-lg: 0 10px 40px rgba(46,50,41,.16);
  --font: "Inter", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body.lock { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { flex: none; display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.boot { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 38px; padding: 0 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  font-weight: 500; font-size: 14px;
  white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn.ghost.active { background: var(--accent-soft); color: var(--accent-hover); }
.btn.icon-only { width: 38px; padding: 0; }
.btn.sm { height: 32px; padding: 0 10px; font-size: 13px; }
.btn.sm.icon-only { width: 32px; }
.btn.danger:hover:not(:disabled) { color: var(--danger); background: var(--danger-soft); }
@media (pointer: coarse) {
  .btn { height: 42px; }
  .btn.icon-only { width: 42px; }
  .btn.sm { height: 38px; }
  .btn.sm.icon-only { width: 38px; }
}

.count-pill {
  min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: 999px; background: var(--accent); color: #fff;
  font-size: 11.5px; font-weight: 600; display: inline-grid; place-items: center;
}
.btn.ghost.active .count-pill { background: var(--accent-hover); }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(246,243,234,.92);
  backdrop-filter: saturate(1.2) blur(10px);
  -webkit-backdrop-filter: saturate(1.2) blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1440px; margin: 0 auto;
  padding: 12px 24px;
  display: flex; align-items: center; gap: 20px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px; background: var(--accent);
  display: grid; place-items: center; color: var(--bg); flex: none;
}
.brand-name { font-weight: 600; font-size: 16px; line-height: 1.2; }
.brand-sub { font-size: 12px; color: var(--muted); line-height: 1.2; white-space: nowrap; }
.nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }

/* ---------- Search ---------- */
.search { position: relative; flex: 1; max-width: 560px; }
.search-box {
  display: flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
  transition: border-color .15s, box-shadow .15s;
}
.search-box:focus-within { border-color: var(--sage); box-shadow: 0 0 0 3px var(--accent-softer); }
.search-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14.5px; }
.search-box .icon { color: var(--muted); }
.search-box input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.meta .tag { font-size: 12.5px; }
.kbd { font-size: 11px; color: var(--faint); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }
.search-pop {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 40;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); max-height: min(70vh, 540px); overflow: auto;
}
.search-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.search-section:last-child { border-bottom: 0; }
.search-label { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.results { list-style: none; margin: 0; padding: 4px 0; }
.result { padding: 10px 14px; cursor: pointer; border-left: 3px solid transparent; }
.result:hover, .result.active { background: var(--surface-2); border-left-color: var(--sage); }
.result-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-bottom: 2px; }
.result-date { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; color: var(--text); }
.result-title { font-weight: 500; }
.result-snippet { font-size: 13px; color: var(--muted); margin-top: 2px; }
.search-empty { padding: 18px 14px; color: var(--muted); font-size: 14px; }
mark { background: #E6EDC4; color: inherit; border-radius: 3px; padding: 0 1px; }

/* ---------- Badges, tags ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11.5px; font-weight: 500; line-height: 1;
  padding: 4px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--muted);
}
.badge.p-high { background: var(--danger-soft); color: var(--danger); }
.badge.p-medium { background: var(--warn-soft); color: var(--warn); }
.badge.p-low { background: var(--accent-softer); color: var(--accent); }
.badge.overdue { background: var(--danger-soft); color: var(--danger); }
.badge.due-today { background: var(--warn-soft); color: var(--warn); }
.tab-badge { font-size: 11.5px; font-weight: 500; padding: 3px 8px; border-radius: 6px; }
.tab-badge.t-work { background: var(--accent-soft); color: var(--accent-hover); }
.tab-badge.t-study { background: var(--study-soft); color: var(--study); }
.tab-badge.t-ideas { background: var(--ideas-soft); color: var(--ideas); }
.tag {
  display: inline; border: 0; padding: 0 4px; margin: 0;
  border-radius: 5px; background: var(--accent-softer); color: var(--accent);
  font-weight: 500; font-size: inherit; line-height: inherit;
}
.tag:hover { background: var(--accent-soft); }
.tag-chip {
  border: 1px solid var(--border); background: var(--surface); color: var(--accent);
  border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 500;
}
.tag-chip:hover { background: var(--accent-softer); border-color: var(--sage); }
.tag-chip span { color: var(--faint); font-weight: 400; margin-left: 4px; }

/* ---------- Layout ---------- */
.layout {
  max-width: 1440px; margin: 0 auto;
  padding: 24px;
  display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 24px;
  align-items: start;
}
@media (max-width: 1180px) { .layout { grid-template-columns: minmax(0, 1fr) 370px; gap: 20px; padding: 20px; } }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; box-shadow: var(--shadow);
}

/* ---------- Calendar ---------- */
.cal { padding: 22px; }
.cal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.cal-title { font-size: 22px; }
.cal-sub { font-size: 13px; color: var(--muted); }
.cal-nav { margin-left: auto; display: flex; gap: 6px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow { text-align: center; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 4px 0 8px; }
.day {
  position: relative; aspect-ratio: 1 / .78; min-height: 52px; max-height: 104px;
  border: 1px solid transparent; border-radius: 12px; background: transparent;
  display: flex; flex-direction: column; align-items: flex-start;
  padding: 8px 9px; text-align: left; font-size: 14px; font-weight: 500;
  transition: background .12s, border-color .12s;
}
.day:hover:not(:disabled) { background: var(--surface-2); }
.day:disabled { color: var(--faint); cursor: not-allowed; font-weight: 400;
  background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(227,221,204,.35) 6px 7px); }
.day .num { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 4px; border-radius: 999px; }
.day.today .num { background: var(--accent-soft); color: var(--accent-hover); font-weight: 600; }
.day.selected { border-color: var(--accent); background: var(--accent-softer); }
.day.selected .num { background: var(--accent); color: #fff; }
.day.weekend:not(:disabled) .num { color: var(--muted); }
.day.selected.weekend .num { color: #fff; }
.day .dot { position: absolute; left: 50%; bottom: 9px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--sage); }
.cal-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
.legend-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--sage); margin-right: 6px; vertical-align: middle; }
.month-steps { display: flex; gap: 4px; margin-left: auto; }
.month-step { border: 0; background: transparent; padding: 3px 8px; border-radius: 6px; font-size: 12.5px; color: var(--muted); }
.month-step:hover { background: var(--surface-2); }
.month-step.on { background: var(--accent-soft); color: var(--accent-hover); font-weight: 600; }

/* ---------- Daily panel ---------- */
.panel {
  position: sticky; top: 88px;
  max-height: calc(100vh - 112px);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel-head { padding: 18px 18px 12px; display: flex; align-items: flex-start; gap: 10px; }
.panel-date { font-size: 18px; line-height: 1.25; }
.panel-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.panel-head-actions { margin-left: auto; display: flex; gap: 2px; }
.panel-close { display: none; }
.tabs { display: flex; gap: 4px; margin: 0 18px; padding: 4px; background: var(--surface-2); border-radius: 12px; }
.tab {
  flex: 1; min-width: 0; height: 40px; border: 0; border-radius: 9px; background: transparent;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 500; font-size: 14px; color: var(--muted);
  transition: background .15s, color .15s;
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--accent); color: #fff; box-shadow: 0 1px 3px rgba(46,50,41,.15); }
.tab .th { font-size: 12px; opacity: .85; }
.tab .n { font-size: 11px; min-width: 18px; height: 18px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--surface-3); color: var(--muted); padding: 0 5px; }
.tab.active .n { background: rgba(255,255,255,.22); color: #fff; }
.panel-body { flex: 1; overflow: auto; padding: 14px 18px 22px; display: flex; flex-direction: column; gap: 10px; }
.compose-btn {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 12px 14px; border: 1.5px dashed var(--border-strong); border-radius: 12px;
  background: transparent; color: var(--muted); font-weight: 500; text-align: left;
}
.compose-btn:hover { border-color: var(--sage); color: var(--accent); background: var(--accent-softer); }
.empty { text-align: center; color: var(--muted); font-size: 14px; padding: 28px 12px; }
.empty .icon { margin: 0 auto 8px; color: var(--faint); }
.backdrop { display: none; }

/* ---------- Entries ---------- */
.entry {
  border: 1px solid var(--border); border-radius: 13px; background: var(--surface);
  padding: 12px 12px 12px 14px;
  transition: border-color .2s, box-shadow .2s;
}
.entry:hover { border-color: var(--border-strong); }
.entry.flash { animation: flash 1.8s ease; }
@keyframes flash { 0%, 40% { border-color: var(--sage); box-shadow: 0 0 0 4px var(--accent-soft); } 100% { box-shadow: 0 0 0 0 transparent; } }
.entry-row { display: flex; align-items: flex-start; gap: 10px; }
.entry-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.entry-title { font-size: 15px; font-weight: 600; line-height: 1.4; word-break: break-word; }
.entry.done .entry-title { text-decoration: line-through; color: var(--faint); }
.entry.done .rich { color: var(--faint); }
.entry-actions { display: flex; gap: 0; margin: -4px -4px 0 0; opacity: .55; transition: opacity .15s; }
.entry:hover .entry-actions, .entry:focus-within .entry-actions { opacity: 1; }
@media (hover: none) { .entry-actions { opacity: 1; } }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.check {
  flex: none; width: 22px; height: 22px; margin-top: 1px;
  border-radius: 7px; border: 1.6px solid var(--border-strong); background: var(--surface);
  display: grid; place-items: center; color: transparent; padding: 0;
  transition: background .15s, border-color .15s, color .15s;
}
.check:hover { border-color: var(--accent); color: var(--accent-soft); }
.check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (pointer: coarse) { .check { width: 26px; height: 26px; } }
.rich { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; font-size: 14.5px; }
.rich a { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--sage); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 9px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.thumb .x, .file-chip .x {
  position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%;
  border: 0; background: rgba(46,50,41,.7); color: #fff; display: grid; place-items: center; padding: 0;
}
.files { display: flex; flex-direction: column; gap: 6px; }
.file-chip {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface-2); font-size: 13px; text-decoration: none; color: var(--text);
}
.file-chip:hover { border-color: var(--border-strong); }
.file-chip .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.file-chip .fsize { color: var(--muted); font-size: 12px; }
.file-chip .x { position: static; flex: none; }
.uploading { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.spinner { display: inline-block; flex: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Editor ---------- */
.editor { border: 1.5px solid var(--sage); border-radius: 13px; background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 0 0 4px var(--accent-softer); }
.editor.drag { background: var(--accent-softer); }
.editor-title { width: 100%; border: 0; outline: 0; background: transparent; font-size: 15.5px; font-weight: 600; padding: 2px 0; }
.editor-title::placeholder, .editor textarea::placeholder { color: var(--faint); font-weight: 400; }
.editor textarea {
  width: 100%; min-height: 120px; resize: vertical;
  border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
  padding: 10px 12px; line-height: 1.55; font-size: 14.5px; outline: 0;
}
.editor textarea:focus { border-color: var(--sage); background: var(--surface); }
.field-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.field input[type=date] { height: 34px; border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; background: var(--surface); }
.segment { display: inline-flex; padding: 3px; background: var(--surface-2); border-radius: 9px; gap: 2px; }
.segment button { border: 0; background: transparent; height: 28px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.segment button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(46,50,41,.12); }
.segment button.on.p-high { color: var(--danger); }
.segment button.on.p-medium { color: var(--warn); }
.segment button.on.p-low { color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.toolbar .spacer { flex: 1; }
.hint { font-size: 12px; color: var(--faint); }
.link-form { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: var(--surface-2); border-radius: 10px; }
.link-form input { flex: 1 1 140px; min-width: 0; height: 34px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; background: var(--surface); outline: 0; }
.link-form input:focus { border-color: var(--sage); }

/* ---------- Pending tasks ---------- */
.pending { padding: 22px; }
.pending-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 6px; }
.pending-head h2 { font-size: 22px; }
.pending-sub { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; }
.group { margin-top: 18px; }
.group-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
.group-title.overdue { color: var(--danger); }
.group-title .n { font-weight: 500; color: var(--faint); }
.task-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); margin-bottom: 8px; }
.task-row:hover { border-color: var(--border-strong); }
.task-main { flex: 1; min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.task-title { font-weight: 500; word-break: break-word; }
.task-src { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.task-open { color: var(--faint); }
.task-row:hover .task-open { color: var(--accent); }

/* ---------- Menu ---------- */
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 45; width: 280px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 6px;
}
.menu-status { padding: 10px 10px 12px; border-bottom: 1px solid var(--border); margin-bottom: 6px; font-size: 12.5px; color: var(--muted); }
.menu-status strong { display: flex; align-items: center; gap: 6px; color: var(--text); font-size: 13.5px; margin-bottom: 2px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sage); }
.status-dot.local { background: var(--warn); }
.menu-item { width: 100%; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; font-size: 14px; text-align: left; }
.menu-item:hover { background: var(--surface-2); }
.menu-sep { height: 1px; background: var(--border); margin: 6px 4px; }

/* ---------- Toasts, lightbox, auth ---------- */

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback, useContext, createContext } = React;

/* ============================================================

const SUPABASE_CONFIG = {

  appId: "",
};
// false = images/files are stored inside Firestore (works on the free Spark plan, ~650 KB per file).
// true  = use Firebase Storage (bigger files; needs the Blaze plan with billing enabled).
const USE_FIREBASE_STORAGE = false;

const FIREBASE_ENABLED = !SUPABASE_ENABLED && Boolean(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId && window.firebase);
if (FIREBASE_ENABLED) {
  firebase.initializeApp(FIREBASE_CONFIG);

  firebase.auth().getRedirectResult().catch(() => {});
}
const CLOUD_ENABLED = SUPABASE_ENABLED || FIREBASE_ENABLED;
const CLOUD_NAME = SUPABASE_ENABLED ? "Supabase" : "Firebase";
const signOutCloud = () => (SUPABASE_ENABLED ? sb.auth.signOut() : firebase.auth().signOut());

/* ============================================================
   2. CONSTANTS
   ============================================================ */
const RANGE_START = "2026-11-06";
const RANGE_END = "2027-03-05";
const FIRST_MONTH = { y: 2026, m: 10 }; // November 2026 (months are 0-based)
const LAST_MONTH = { y: 2027, m: 2 };   // March 2027
const TABS = [
  { id: "work", en: "Work", th: "งาน", icon: "briefcase", noun: "task" },
  { id: "study", en: "Study", th: "เรียน", icon: "book", noun: "note" },
  { id: "ideas", en: "Ideas", th: "ไอเดีย", icon: "zap", noun: "idea" },
];
const TAB_BY_ID = Object.fromEntries(TABS.map((t) => [t.id, t]));
const PRIORITIES = [
  { id: "high", label: "High" },
  { id: "medium", label: "Medium" },
  { id: "low", label: "Low" },
];
const PRIORITY_RANK = { high: 0, medium: 1, low: 2 };
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MAX_INLINE_CHARS = 900 * 1024; // Firestore document limit is 1 MiB

/* ============================================================
   3. UTILITIES — dates, ids, text parsing, files
   ============================================================ */
const pad = (n) => String(n).padStart(2, "0");
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const inRange = (k) => k >= RANGE_START && k <= RANGE_END;
const todayKey = () => toKey(new Date());
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return toKey(d); };
const fmtLong = (k) => fromKey(k).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const fmtShort = (k) => fromKey(k).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const fmtDue = (k) => fromKey(k).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const monthLabel = (y, m) => new Date(y, m, 1).toLocaleDateString("en-GB", { month: "long", year: "numeric" });
const monthIdx = ({ y, m }) => y * 12 + m;
const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const fmtSize = (b) => (b < 1024 ? `${b} B` : b < 1048576 ? `${Math.round(b / 1024)} KB` : `${(b / 1048576).toFixed(1)} MB`);
const firstLine = (s) => (s || "").split("\n").find((l) => l.trim()) || "";
const entryLabel = (e) => e.title || firstLine(e.body).slice(0, 90) || "(untitled)";
const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

// Markdown link [label](url) · bare URL · #tag (letters incl. Thai, numbers, _ and -)
const RICH_RE = /\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<]*[^\s<.,;:!?)\]'"])|(^|[\s(\[{,;:!?"'])#([\p{L}\p{M}\p{N}_-]+)/gu;

function tokenize(text) {
  const out = [];
  let last = 0, m;
  RICH_RE.lastIndex = 0;
  const pushText = (a, b) => { if (b > a) out.push({ t: "text", v: text.slice(a, b) }); };
  while ((m = RICH_RE.exec(text))) {
    if (m[1] !== undefined) { pushText(last, m.index); out.push({ t: "link", label: m[1], href: m[2] }); }
    else if (m[3] !== undefined) { pushText(last, m.index); out.push({ t: "link", label: m[3], href: m[3] }); }
    else { pushText(last, m.index + m[4].length); out.push({ t: "tag", v: m[5] }); }
    last = RICH_RE.lastIndex;
  }
  pushText(last, text.length);
  return out;
}

function extractTags(text) {
  const seen = new Map();
  tokenize(text || "").forEach((tk) => { if (tk.t === "tag" && !seen.has(tk.v.toLowerCase())) seen.set(tk.v.toLowerCase(), tk.v); });
  return [...seen.values()];
}

// Make every entry Firestore-safe (no undefined values) and consistent.
function normalizeEntry(e) {
  const isWork = e.tab === "work";
  return {
    id: String(e.id || uid()),
    date: String(e.date),
    tab: e.tab,
    title: String(e.title || ""),
    body: String(e.body || ""),
    done: isWork ? Boolean(e.done) : false,
    doneAt: isWork && e.done ? Number(e.doneAt) || Date.now() : null,
    due: isWork && e.due ? String(e.due) : null,
    priority: isWork ? (PRIORITY_RANK[e.priority] !== undefined ? e.priority : "medium") : null,
    attachments: Array.isArray(e.attachments) ? JSON.parse(JSON.stringify(e.attachments)) : [],
    tags: extractTags(`${e.title || ""}\n${e.body || ""}`),
    createdAt: Number(e.createdAt) || Date.now(),
    updatedAt: Number(e.updatedAt) || Date.now(),
  };
}

function blobToDataURL(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
}
function dataURLToBlob(dataURL) {
  const [head, b64] = dataURL.split(",");
  const type = (head.match(/data:([^;]+)/) || [])[1] || "application/octet-stream";
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}

// Shrink photos so they fit in Firestore (and load fast on iPad).
async function compressImage(file, targetBytes = 600 * 1024) {
  if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type) || file.size <= targetBytes) return file;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let maxDim = 1600, quality = 0.82, blob = null;
    for (let attempt = 0; attempt < 6; attempt++) {
      const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      blob = await new Promise((res) => c.toBlob(res, "image/jpeg", quality));
      if (blob && blob.size <= targetBytes) break;
      quality = Math.max(0.5, quality - 0.1); maxDim = Math.round(maxDim * 0.82);
    }
    return blob ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
  } catch { return file; } finally { URL.revokeObjectURL(url); }
}

function downloadBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ============================================================
   4. DATA LAYER — same interface for both backends
      subscribe · save · saveMany · remove · putFile · putFileWithId
      getFileBlob · getFileURL · removeFile
   ============================================================ */

// ---- 4a. Local (IndexedDB) — demo mode, no login ----
let idbPromise = null;
function openIDB() {
  if (!idbPromise) idbPromise = new Promise((res, rej) => {
    const req = indexedDB.open("second-brain-notebook", 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore("entries", { keyPath: "id" });
      req.result.createObjectStore("files", { keyPath: "id" });
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
  return idbPromise;
}
async function idbRun(storeName, mode, fn) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(storeName, mode);
    const req = fn(tx.objectStore(storeName));
    tx.oncomplete = () => res(req ? req.result : undefined);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error("Storage is full or blocked."));
  });
}

function createLocalStore() {
  let entries = [];
  const subs = new Set();
  const urls = new Map();
  const emit = () => subs.forEach((cb) => cb(entries));
  const ready = idbRun("entries", "readonly", (s) => s.getAll()).then((r) => { entries = r || []; });

  const getFileBlob = async (meta) => { const r = await idbRun("files", "readonly", (s) => s.get(meta.id)); return r ? r.blob : null; };
  const putFileWithId = async (meta, blob) => {
    await idbRun("files", "readwrite", (s) => s.put({ id: meta.id, blob }));
    return { id: meta.id, name: meta.name, type: meta.type, size: meta.size, kind: meta.kind, storage: "local" };
  };
  return {
    mode: "local",
    subscribe(cb, onError) {
      subs.add(cb);
      ready.then(() => cb(entries)).catch((e) => onError && onError(e));
      return () => subs.delete(cb);
    },
    async save(e) { await idbRun("entries", "readwrite", (s) => s.put(e)); entries = [...entries.filter((x) => x.id !== e.id), e]; emit(); },
    async saveMany(list) {
      await idbRun("entries", "readwrite", (s) => { list.forEach((e) => s.put(e)); });
      const ids = new Set(list.map((e) => e.id));
      entries = [...entries.filter((x) => !ids.has(x.id)), ...list]; emit();
    },
    async remove(id) { await idbRun("entries", "readwrite", (s) => s.delete(id)); entries = entries.filter((x) => x.id !== id); emit(); },
    async putFile(file, kind) {
      return putFileWithId({ id: uid(), name: file.name || "file", type: file.type || "application/octet-stream", size: file.size, kind }, file);
    },
    putFileWithId,
    getFileBlob,
    async getFileURL(meta) {
      if (urls.has(meta.id)) return urls.get(meta.id);
      const b = await getFileBlob(meta); if (!b) return null;
      const u = URL.createObjectURL(b); urls.set(meta.id, u); return u;
    },
    async removeFile(meta) { await idbRun("files", "readwrite", (s) => s.delete(meta.id)); urls.delete(meta.id); },
  };
}

// ---- 4b. Firebase (Auth + Firestore [+ Storage]) — synced across devices ----
function createFirebaseStore(user) {
  const base = firebase.firestore().collection("users").doc(user.uid);
  const col = base.collection("entries");
  const filesCol = base.collection("files");
  const urls = new Map();

  async function putBlob(meta, blob) {
    const clean = { id: meta.id, name: meta.name, type: blob.type || meta.type, size: blob.size, kind: meta.kind };
    if (USE_FIREBASE_STORAGE) {
      const path = `users/${user.uid}/files/${meta.id}`;
      const ref = firebase.storage().ref(path);
      await ref.put(blob, { contentType: clean.type, customMetadata: { name: clean.name } });
      return { ...clean, storage: "cloud", path, url: await ref.getDownloadURL() };
    }
    const data = await blobToDataURL(blob);
    if (data.length > MAX_INLINE_CHARS) {
      throw new Error(`"${clean.name}" is ${fmtSize(blob.size)} — too big for the free plan (≈650 KB per file). Enable Firebase Storage for larger files.`);
    }
    await filesCol.doc(meta.id).set({ data, name: clean.name, type: clean.type });
    return { ...clean, storage: "inline" };
  }
  const getFileBlob = async (meta) => {
    if (meta.storage === "cloud") return null; // already a URL; not embedded in backups
    const d = await filesCol.doc(meta.id).get();
    return d.exists ? dataURLToBlob(d.data().data) : null;
  };
  return {
    mode: "cloud",
    subscribe(cb, onError) { return col.onSnapshot((snap) => cb(snap.docs.map((d) => d.data())), onError); },
    save: (e) => col.doc(e.id).set(e),
    async saveMany(list) {
      for (let i = 0; i < list.length; i += 400) {
        const batch = firebase.firestore().batch();
        list.slice(i, i + 400).forEach((e) => batch.set(col.doc(e.id), e));
        await batch.commit();
      }
    },
    remove: (id) => col.doc(id).delete(),
    async putFile(file, kind) {
      const blob = kind === "image" && !USE_FIREBASE_STORAGE ? await compressImage(file) : file;
      return putBlob({ id: uid(), name: blob.name || file.name || "file", type: file.type, kind }, blob);
    },
    putFileWithId: (meta, blob) => putBlob(meta, blob),
    getFileBlob,
    async getFileURL(meta) {
      if (meta.url) return meta.url;
      if (urls.has(meta.id)) return urls.get(meta.id);
      const b = await getFileBlob(meta); if (!b) return null;
      const u = URL.createObjectURL(b); urls.set(meta.id, u); return u;
    },
    async removeFile(meta) {
      if (meta.storage === "cloud") await firebase.storage().ref(meta.path).delete().catch(() => {});
      else await filesCol.doc(meta.id).delete();
    },
  };
}

// ---- 4c. Supabase (Auth + Postgres + Realtime + Storage) — synced across devices ----
const SB_BUCKET = "notebook-files";
const SB_MAX_FILE = 50 * 1024 * 1024;
const SB_TABLE = "entries";
function createSupabaseStore(client, user) {
  const rows = new Map(); // id -> entry (camelCase)
  const subs = new Set();
  const urls = new Map(); // file id -> { url, exp }
  let loaded = false;
  const emit = () => { if (loaded) { const list = [...rows.values()]; subs.forEach((cb) => cb(list)); } };
  const toRow = (e) => ({
    id: e.id, user_id: user.id, date: e.date, tab: e.tab, title: e.title, body: e.body,
    done: e.done, done_at: e.doneAt, due: e.due, priority: e.priority,
    attachments: e.attachments, tags: e.tags, created_at: e.createdAt, updated_at: e.updatedAt,
  });
  const fromRow = (r) => ({
    id: r.id, date: r.date, tab: r.tab, title: r.title || "", body: r.body || "",
    done: Boolean(r.done), doneAt: r.done_at == null ? null : Number(r.done_at), due: r.due || null, priority: r.priority || null,
    attachments: Array.isArray(r.attachments) ? r.attachments : [], tags: r.tags || [],
    createdAt: Number(r.created_at) || 0, updatedAt: Number(r.updated_at) || 0,
  });
  const check = ({ error }) => { if (error) throw error; };
  const fileName = (meta) => meta.path || `${user.id}/${meta.id}`;

  async function putBlob(meta, blob) {
    if (blob.size > SB_MAX_FILE) throw new Error(`"${meta.name}" is ${fmtSize(blob.size)} — too big (max 50 MB per file).`);
    const type = blob.type || meta.type || "application/octet-stream";
    const path = `${user.id}/${meta.id}`;
    const { error } = await client.storage.from(SB_BUCKET).upload(path, blob, { contentType: type, upsert: false });
    // Re-importing the same backup: the object already exists — keep it.
    if (error && !(String(error.statusCode) === "409" || /exists|duplicate/i.test(error.message || ""))) throw error;
    return { id: meta.id, name: meta.name, type, size: blob.size, kind: meta.kind, storage: "supabase", path };
  }
  const getFileBlob = async (meta) => {
    if (meta.storage !== "supabase") return null;
    const { data, error } = await client.storage.from(SB_BUCKET).download(fileName(meta));
    if (error) throw error;
    return data;
  };

  return {
    mode: "cloud",
    subscribe(cb, onError) {
      subs.add(cb);
      const fail = (e) => onError && onError(e);
      // Ignore stale echoes: only apply if we have no copy or the incoming row is at least as new.
      const upsertLocal = (r) => {
        if (!r || !r.id) return;
        const next = fromRow(r), cur = rows.get(r.id);
        if (cur && next.updatedAt < cur.updatedAt) return;
        rows.set(r.id, next); emit();
      };
      const channel = client
        .channel(`entries-${user.id}-${uid()}`)
        .on("postgres_changes", { event: "INSERT", schema: "public", table: SB_TABLE, filter: `user_id=eq.${user.id}` }, (p) => upsertLocal(p.new))
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: SB_TABLE, filter: `user_id=eq.${user.id}` }, (p) => upsertLocal(p.new))
        // DELETE events can't be filtered and only carry the primary key — ignore ids we don't have.
        .on("postgres_changes", { event: "DELETE", schema: "public", table: SB_TABLE }, (p) => {
          const id = p.old && p.old.id;
          if (id && rows.has(id)) { rows.delete(id); emit(); }
        })
        .subscribe((status, err) => { if (status === "CHANNEL_ERROR") fail(err || new Error("Live sync disconnected — changes from other devices may be delayed.")); });
      (async () => {
        const PAGE = 1000;
        for (let from = 0; ; from += PAGE) {
          const { data, error } = await client.from(SB_TABLE).select("*").order("id").range(from, from + PAGE - 1);
          if (error) throw error;
          data.forEach((r) => { const cur = rows.get(r.id); if (!cur || Number(r.updated_at) >= cur.updatedAt) rows.set(r.id, fromRow(r)); });
          if (data.length < PAGE) break;
        }
        loaded = true;
        emit();
      })().catch(fail);
      return () => { subs.delete(cb); client.removeChannel(channel); };
    },
    async save(e) {
      const prev = rows.get(e.id);
      rows.set(e.id, e); emit();
      try { check(await client.from(SB_TABLE).upsert(toRow(e))); }
      catch (err) { if (prev) rows.set(e.id, prev); else rows.delete(e.id); emit(); throw err; }
    },
    async saveMany(list) {
      const prev = new Map(list.map((e) => [e.id, rows.get(e.id)]));
      list.forEach((e) => rows.set(e.id, e)); emit();
      try {
        for (let i = 0; i < list.length; i += 500) check(await client.from(SB_TABLE).upsert(list.slice(i, i + 500).map(toRow)));
      } catch (err) {
        prev.forEach((p, id) => { if (p) rows.set(id, p); else rows.delete(id); }); emit();
        throw err;
      }
    },
    async remove(id) {
      const prev = rows.get(id);
      rows.delete(id); emit();
      try { check(await client.from(SB_TABLE).delete().eq("id", id)); }
      catch (err) { if (prev) { rows.set(id, prev); emit(); } throw err; }
    },
    async putFile(file, kind) {
      const blob = kind === "image" ? await compressImage(file, 1.5 * 1024 * 1024) : file;
      return putBlob({ id: uid(), name: blob.name || file.name || "file", type: file.type, kind }, blob);
    },
    putFileWithId: (meta, blob) => putBlob(meta, blob),
    getFileBlob,
    async getFileURL(meta) {
      if (meta.url) return meta.url;
      if (meta.storage !== "supabase") return null;
      const hit = urls.get(meta.id);
      if (hit && hit.exp > Date.now() + 60000) return hit.url;
      const { data, error } = await client.storage.from(SB_BUCKET).createSignedUrl(fileName(meta), 3600);
      if (error) throw error;
      urls.set(meta.id, { url: data.signedUrl, exp: Date.now() + 3600 * 1000 });
      return data.signedUrl;
    },
    async removeFile(meta) {
      urls.delete(meta.id);
      if (meta.storage !== "supabase") return;
      check(await client.storage.from(SB_BUCKET).remove([fileName(meta)]));
    },
  };
}

    <svg className="icon" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"

/* ============================================================
   6. SMALL BUILDING BLOCKS
   ============================================================ */
function RichText({ text }) {
  const { onTag } = useApp();
  return tokenize(text).map((tk, i) => {
    if (tk.t === "link") return <a key={i} href={tk.href} target="_blank" rel="noopener noreferrer">{tk.label}</a>;
    if (tk.t === "tag") return <button key={i} type="button" className="tag" onClick={(e) => { e.stopPropagation(); onTag("#" + tk.v); }}>#{tk.v}</button>;
    return <React.Fragment key={i}>{tk.v}</React.Fragment>;
  });
}

function Highlight({ text, terms }) {
  const t = terms.filter(Boolean);
  if (!t.length) return text;
  const re = new RegExp(`(${t.map(escapeRe).join("|")})`, "gi");
  return text.split(re).map((p, i) => (i % 2 ? <mark key={i}>{p}</mark> : <React.Fragment key={i}>{p}</React.Fragment>));
}

function PriorityBadge({ p }) {
  if (!p) return null;
  return <span className={`badge p-${p}`}><Icon name="flag" size={11} strokeWidth={2.2} />{PRIORITIES.find((x) => x.id === p).label}</span>;
}
function DueBadge({ due, done }) {
  if (!due) return null;
  const today = todayKey();
  const cls = done ? "" : due < today ? "overdue" : due === today ? "due-today" : "";
  const label = !done && due < today ? `Overdue · ${fmtDue(due)}` : due === today ? "Due today" : `Due ${fmtDue(due)}`;
  return <span className={`badge ${cls}`}><Icon name="clock" size={11} strokeWidth={2.2} />{label}</span>;
}

function useFileURL(meta) {
  const { store } = useApp();
  const [url, setUrl] = useState(meta.url || null);
  useEffect(() => {
    let alive = true;
    if (!meta.url) store.getFileURL(meta).then((u) => alive && setUrl(u)).catch(() => {});
    return () => { alive = false; };
  }, [meta.id, store]);
  return url;
}

function Thumb({ meta, onRemove }) {
  const url = useFileURL(meta);
  const { openImage } = useApp();
  return (
    <div className="thumb">
      {url ? <img src={url} alt={meta.name} loading="lazy" onClick={() => openImage(url)} /> : <div className="uploading" style={{ height: "100%", justifyContent: "center" }}><span className="spinner" /></div>}
      {onRemove && <button type="button" className="x" onClick={() => onRemove(meta)} aria-label={`Remove ${meta.name}`}><Icon name="x" size={13} strokeWidth={2.4} /></button>}
    </div>
  );
}
function FileChip({ meta, onRemove }) {
  const url = useFileURL(meta);
  const inner = (
    <>
      <Icon name="file" size={18} />
      <span className="fname">{meta.name}</span>
      <span className="fsize">{fmtSize(meta.size || 0)}</span>
      {onRemove
        ? <button type="button" className="x" onClick={(e) => { e.preventDefault(); onRemove(meta); }} aria-label={`Remove ${meta.name}`}><Icon name="x" size={13} strokeWidth={2.4} /></button>
        : <Icon name="download" size={16} />}
    </>
  );
  if (onRemove || !url) return <div className="file-chip">{inner}</div>;
  return <a className="file-chip" href={url} download={meta.name} target="_blank" rel="noopener noreferrer">{inner}</a>;
}
function Attachments({ list, onRemove }) {
  if (!list || !list.length) return null;
  const images = list.filter((a) => a.kind === "image");
  const files = list.filter((a) => a.kind !== "image");
  return (
    <>
      {images.length > 0 && <div className="thumbs">{images.map((a) => <Thumb key={a.id} meta={a} onRemove={onRemove} />)}</div>}
      {files.length > 0 && <div className="files">{files.map((a) => <FileChip key={a.id} meta={a} onRemove={onRemove} />)}</div>}
    </>
  );
}

/* ============================================================
   7. ENTRY EDITOR — title, rich body, links, images, files, due date, priority
   ============================================================ */
function EntryEditor({ initial, date, tab, onClose }) {
  const { store, toast, actions } = useApp();
  const isWork = tab === "work";
  const [title, setTitle] = useState(initial.title || "");
  const [body, setBody] = useState(initial.body || "");
  const [due, setDue] = useState(initial.due || "");
  const [priority, setPriority] = useState(initial.priority || "medium");
  const [atts, setAtts] = useState(initial.attachments || []);
  const [uploading, setUploading] = useState(0);
  const [saving, setSaving] = useState(false);
  const [linkOpen, setLinkOpen] = useState(false);
  const [linkUrl, setLinkUrl] = useState("");
  const [linkLabel, setLinkLabel] = useState("");
  const [drag, setDrag] = useState(false);
  const added = useRef([]);    // uploaded during this edit session
  const removed = useRef([]);  // existing attachments the user removed
  const taRef = useRef(null);
  const titleRef = useRef(null);
  const imgInput = useRef(null);
  const fileInput = useRef(null);

  useEffect(() => { (initial.id ? taRef : titleRef).current?.focus(); }, []);

  async function addFiles(fileList, forceKind) {
    const files = [...fileList];
    for (const file of files) {
      const kind = forceKind || (file.type.startsWith("image/") ? "image" : "file");
      setUploading((n) => n + 1);
      try {
        const meta = await store.putFile(file, kind);
        added.current.push(meta);
        setAtts((a) => [...a, meta]);
      } catch (err) { toast(err.message || "Upload failed", "error"); }
      finally { setUploading((n) => n - 1); }
    }
  }
  function removeAtt(meta) {
    setAtts((a) => a.filter((x) => x.id !== meta.id));
    if (added.current.some((x) => x.id === meta.id)) {
      added.current = added.current.filter((x) => x.id !== meta.id);
      store.removeFile(meta).catch(() => {});
    } else removed.current.push(meta);
  }
  function insertAtCursor(snippet) {
    const ta = taRef.current;
    const s = ta ? ta.selectionStart : body.length;
    const e = ta ? ta.selectionEnd : body.length;
    const before = body.slice(0, s);
    const sep = before && !/\s$/.test(before) ? " " : "";
    const next = before + sep + snippet + " " + body.slice(e);
    setBody(next);
    requestAnimationFrame(() => { if (ta) { ta.focus(); const pos = (before + sep + snippet + " ").length; ta.setSelectionRange(pos, pos); } });
  }
  function addLink(ev) {
    ev.preventDefault();
    let u = linkUrl.trim(); if (!u) return;
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    const label = linkLabel.trim().replace(/[\[\]]/g, "");
    insertAtCursor(label ? `[${label}](${u})` : u);
    setLinkUrl(""); setLinkLabel(""); setLinkOpen(false);
  }
  async function save() {
    if (uploading) return toast("Wait for uploads to finish…");
    if (!title.trim() && !body.trim() && !atts.length) return toast("Write something first.");
    setSaving(true);
    try {
      await actions.save({
        ...initial, date, tab,
        title: title.trim(), body: body.replace(/\s+$/, ""),
        attachments: atts, due: isWork ? due || null : null, priority: isWork ? priority : null,
        updatedAt: Date.now(),
      });
      removed.current.forEach((m) => store.removeFile(m).catch(() => {}));
      added.current = [];
      onClose();
    } catch (err) { toast(err.message || "Could not save", "error"); setSaving(false); }
  }
  function cancel() {
    added.current.forEach((m) => store.removeFile(m).catch(() => {}));
    onClose();
  }
  function onKeyDown(e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); }
    if (e.key === "Escape") { e.stopPropagation(); cancel(); }
  }
  function onPaste(e) {
    const files = [...(e.clipboardData?.files || [])];
    if (files.length) { e.preventDefault(); addFiles(files); }
  }

  return (
    <div className={`editor${drag ? " drag" : ""}`} onKeyDown={onKeyDown}
      onDragOver={(e) => { e.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)}
      onDrop={(e) => { e.preventDefault(); setDrag(false); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); }}>
      <input ref={titleRef} className="editor-title" value={title} onChange={(e) => setTitle(e.target.value)}
        placeholder={isWork ? "Task title" : tab === "study" ? "What did you learn?" : "Idea title"} aria-label="Title" />
      <textarea ref={taRef} value={body} onChange={(e) => setBody(e.target.value)} onPaste={onPaste}
        placeholder={"Notes… paste links or screenshots here. Add #tags like #Internship #Urgent"} aria-label="Notes" />

      {isWork && (
        <div className="field-row">
          <label className="field"><Icon name="clock" size={15} />Due
            <input type="date" value={due} onChange={(e) => setDue(e.target.value)} />
          </label>
          <div className="field"><Icon name="flag" size={15} />
            <div className="segment" role="radiogroup" aria-label="Priority">
              {PRIORITIES.map((p) => (
                <button key={p.id} type="button" role="radio" aria-checked={priority === p.id}
                  className={`${priority === p.id ? "on" : ""} p-${p.id}`} onClick={() => setPriority(p.id)}>{p.label}</button>
              ))}
            </div>
          </div>
        </div>
      )}

      <Attachments list={atts} onRemove={removeAtt} />
      {uploading > 0 && <div className="uploading"><span className="spinner" />Uploading {uploading} file{uploading > 1 ? "s" : ""}…</div>}

      {linkOpen && (
        <form className="link-form" onSubmit={addLink}>
          <input autoFocus value={linkUrl} onChange={(e) => setLinkUrl(e.target.value)} placeholder="https://…" aria-label="Link URL" inputMode="url" />
          <input value={linkLabel} onChange={(e) => setLinkLabel(e.target.value)} placeholder="Text to show (optional)" aria-label="Link text" />
          <button className="btn sm primary" type="submit">Insert</button>
          <button className="btn sm ghost" type="button" onClick={() => setLinkOpen(false)}>Cancel</button>
        </form>
      )}

      <div className="toolbar">
        <button type="button" className="btn sm ghost icon-only" title="Insert link" aria-label="Insert link" onClick={() => setLinkOpen((v) => !v)}><Icon name="link" size={17} /></button>
        <button type="button" className="btn sm ghost icon-only" title="Insert image" aria-label="Insert image" onClick={() => imgInput.current.click()}><Icon name="image" size={17} /></button>
        <button type="button" className="btn sm ghost icon-only" title="Attach file" aria-label="Attach file" onClick={() => fileInput.current.click()}><Icon name="paperclip" size={17} /></button>
        <input ref={imgInput} type="file" accept="image/*" multiple hidden onChange={(e) => { addFiles(e.target.files, "image"); e.target.value = ""; }} />
        <input ref={fileInput} type="file" multiple hidden onChange={(e) => { addFiles(e.target.files); e.target.value = ""; }} />
        <span className="spacer" />
        <span className="hint">Ctrl/⌘ + Enter</span>
        <button type="button" className="btn sm ghost" onClick={cancel}>Cancel</button>
        <button type="button" className="btn sm primary" onClick={save} disabled={saving || uploading > 0}>{saving ? "Saving…" : "Save"}</button>
      </div>
    </div>
  );
}

/* ============================================================
   8. ENTRY CARD (view mode)
   ============================================================ */
function EntryCard({ entry, focused }) {
  const { actions } = useApp();
  const [editing, setEditing] = useState(false);
  const [flash, setFlash] = useState(false);
  const ref = useRef(null);
  const isWork = entry.tab === "work";

  useEffect(() => {
    if (!focused) return;
    ref.current?.scrollIntoView({ behavior: "smooth", block: "center" });
    setFlash(true);
    const t = setTimeout(() => setFlash(false), 1900);
    return () => clearTimeout(t);
  }, [focused]);

  if (editing) return <EntryEditor initial={entry} date={entry.date} tab={entry.tab} onClose={() => setEditing(false)} />;

  return (
    <article ref={ref} className={`entry${entry.done ? " done" : ""}${flash ? " flash" : ""}`}>
      <div className="entry-row">
        {isWork && (
          <button type="button" className={`check${entry.done ? " on" : ""}`} onClick={() => actions.toggleDone(entry)}
            aria-label={entry.done ? "Mark as not done" : "Mark as done"} aria-pressed={entry.done}>
            <Icon name="check" size={14} strokeWidth={3} />
          </button>
        )}
        <div className="entry-main">
          {entry.title && <h4 className="entry-title"><RichText text={entry.title} /></h4>}
          {isWork && (entry.priority || entry.due) && <div className="meta"><PriorityBadge p={entry.priority} /><DueBadge due={entry.due} done={entry.done} /></div>}
          {entry.body && <div className="rich"><RichText text={entry.body} /></div>}
          <Attachments list={entry.attachments} />
        </div>
        <div className="entry-actions">
          <button type="button" className="btn sm ghost icon-only" onClick={() => setEditing(true)} aria-label="Edit" title="Edit"><Icon name="edit" size={15} /></button>
          <button type="button" className="btn sm ghost icon-only danger" onClick={() => actions.remove(entry)} aria-label="Delete" title="Delete"><Icon name="trash" size={15} /></button>
        </div>
      </div>
    </article>
  );
}

/* ============================================================
   9. DAILY PANEL — Work / Study / Ideas tabs for one date
   ============================================================ */
function DailyPanel({ date, tab, setTab, entries, open, onClose, onDateChange, focusId }) {
  const [composing, setComposing] = useState(false);
  useEffect(() => setComposing(false), [date, tab]);

  const day = useMemo(() => entries.filter((e) => e.date === date), [entries, date]);
  const counts = useMemo(() => Object.fromEntries(TABS.map((t) => [t.id, day.filter((e) => e.tab === t.id).length])), [day]);
  const list = useMemo(() => {
    const l = day.filter((e) => e.tab === tab);
    return tab === "work"
      ? l.sort((a, b) => (a.done - b.done) || (PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority]) || (a.createdAt - b.createdAt))
      : l.sort((a, b) => a.createdAt - b.createdAt);
  }, [day, tab]);
  const openTasks = day.filter((e) => e.tab === "work" && !e.done).length;
  const t = TAB_BY_ID[tab];

  return (
    <aside className={`card panel${open ? " open" : ""}`} aria-label="Daily notes">
      <div className="panel-head">
        <div>
          <h2 className="panel-date">{fmtLong(date)}</h2>
          <div className="panel-meta">{day.length ? `${day.length} item${day.length > 1 ? "s" : ""}${openTasks ? ` · ${openTasks} open task${openTasks > 1 ? "s" : ""}` : ""}` : "Nothing yet"}{date === todayKey() ? " · Today" : ""}</div>
        </div>
        <div className="panel-head-actions">
          <button className="btn sm ghost icon-only" disabled={!inRange(addDays(date, -1))} onClick={() => onDateChange(addDays(date, -1))} aria-label="Previous day"><Icon name="chevronLeft" /></button>
          <button className="btn sm ghost icon-only" disabled={!inRange(addDays(date, 1))} onClick={() => onDateChange(addDays(date, 1))} aria-label="Next day"><Icon name="chevronRight" /></button>

/* ============================================================
   10. CALENDAR — restricted to 6 Nov 2026 → 5 Mar 2027
   ============================================================ */
function Calendar({ month, setMonth, selected, onSelect, byDate }) {
  const { y, m } = month;
  const idx = monthIdx(month);
  const canPrev = idx > monthIdx(FIRST_MONTH);
  const canNext = idx < monthIdx(LAST_MONTH);
  const step = (d) => { const n = new Date(y, m + d, 1); setMonth({ y: n.getFullYear(), m: n.getMonth() }); };
  const today = todayKey();

  const cells = [];
  const lead = new Date(y, m, 1).getDay();
  const daysIn = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= daysIn; d++) cells.push(toKey(new Date(y, m, d)));
  while (cells.length % 7) cells.push(null);

  const monthPrefix = `${y}-${pad(m + 1)}`;
  const activeDays = [...byDate.keys()].filter((k) => k.startsWith(monthPrefix)).length;
  const months = [];
  for (let i = monthIdx(FIRST_MONTH); i <= monthIdx(LAST_MONTH); i++) months.push({ y: Math.floor(i / 12), m: i % 12 });

  return (
    <section className="card cal" aria-label="Calendar">
      <div className="cal-head">
        <div>
          <h2 className="cal-title">{monthLabel(y, m)}</h2>
          <div className="cal-sub">{activeDays ? `${activeDays} day${activeDays > 1 ? "s" : ""} with notes` : "No notes this month yet"}</div>
        </div>
        <div className="cal-nav">
          {inRange(today) && <button className="btn sm" onClick={() => onSelect(today)}>Today</button>}
          <button className="btn sm icon-only" disabled={!canPrev} onClick={() => step(-1)} aria-label="Previous month"><Icon name="chevronLeft" /></button>
          <button className="btn sm icon-only" disabled={!canNext} onClick={() => step(1)} aria-label="Next month"><Icon name="chevronRight" /></button>
        </div>
      </div>

      <div className="cal-grid">
        {DOW.map((d) => <div key={d} className="dow" aria-hidden="true">{d}</div>)}
        {cells.map((k, i) => {
          if (!k) return <div key={`e${i}`} aria-hidden="true" />;
          const c = byDate.get(k);
          const dow = fromKey(k).getDay();
          const cls = ["day", k === today && "today", k === selected && "selected", (dow === 0 || dow === 6) && "weekend"].filter(Boolean).join(" ");
          return (
            <button key={k} className={cls} disabled={!inRange(k)} onClick={() => onSelect(k)}
              aria-pressed={k === selected} aria-label={`${fmtLong(k)}${c ? `, ${c.total} item${c.total > 1 ? "s" : ""}` : ""}`}
              title={c ? `Work ${c.work} · Study ${c.study} · Ideas ${c.ideas}` : undefined}>
              <span className="num">{Number(k.slice(8))}</span>
              {c && <span className="dot" aria-hidden="true" />}
            </button>
          );
        })}
      </div>

      <div className="cal-foot">
        <span><span className="legend-dot" />Has notes or tasks</span>
        <span>Range: 6 Nov 2026 – 5 Mar 2027</span>
        <div className="month-steps">
          {months.map((mm) => (
            <button key={mm.m} className={`month-step${mm.y === y && mm.m === m ? " on" : ""}`} onClick={() => setMonth(mm)}>
              {new Date(mm.y, mm.m, 1).toLocaleDateString("en-GB", { month: "short" })}
            </button>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   12. GLOBAL SEARCH — keywords + #tags, shows date and tab
   ============================================================ */
function parseQuery(q) {
  const tags = [], words = [];
  q.trim().split(/\s+/).filter(Boolean).forEach((tok) => {
    if (tok.startsWith("#") && tok.length > 1) tags.push(tok.slice(1).toLowerCase());
    else if (tok !== "#") words.push(tok.toLowerCase());
  });
  return { tags, words };
}
function makeSnippet(body, words) {
  const flat = (body || "").replace(/\s+/g, " ").trim();
  if (!flat) return "";
  const lower = flat.toLowerCase();
  let idx = -1;
  words.forEach((w) => { const i = lower.indexOf(w); if (i >= 0 && (idx < 0 || i < idx)) idx = i; });
  if (idx < 0) return flat.length > 130 ? flat.slice(0, 130) + "…" : flat;
  const start = Math.max(0, idx - 50);
  return (start > 0 ? "…" : "") + flat.slice(start, start + 140) + (start + 140 < flat.length ? "…" : "");
}

function SearchBar({ entries, query, setQuery, open, setOpen, inputRef, onPick }) {
  const wrapRef = useRef(null);
  const [active, setActive] = useState(0);
  const { tags, words } = useMemo(() => parseQuery(query), [query]);

  const allTags = useMemo(() => {
    const map = new Map();
    entries.forEach((e) => e.tags.forEach((t) => {
      const k = t.toLowerCase();
      map.set(k, { tag: map.get(k)?.tag || t, n: (map.get(k)?.n || 0) + 1 });
    }));
    return [...map.values()].sort((a, b) => b.n - a.n || a.tag.localeCompare(b.tag));
  }, [entries]);

  const results = useMemo(() => {
    if (!tags.length && !words.length) return [];
    const order = { work: 0, study: 1, ideas: 2 };
    return entries.filter((e) => {
      const et = e.tags.map((t) => t.toLowerCase());
      if (!tags.every((t) => et.some((x) => x.startsWith(t)))) return false;
      const hay = `${e.title}\n${e.body}\n${e.attachments.map((a) => a.name).join(" ")}`.toLowerCase();
      return words.every((w) => hay.includes(w));
    }).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : order[a.tab] - order[b.tab]));
  }, [entries, tags, words]);

  const lastTok = query.split(/\s+/).pop() || "";
  const tagSuggestions = lastTok.startsWith("#")
    ? allTags.filter((t) => t.tag.toLowerCase().startsWith(lastTok.slice(1).toLowerCase()) && t.tag.toLowerCase() !== lastTok.slice(1).toLowerCase()).slice(0, 8)
    : [];

  useEffect(() => setActive(0), [query]);
  useEffect(() => {
    const onDown = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("pointerdown", onDown);
    return () => document.removeEventListener("pointerdown", onDown);
  }, []);

  const completeTag = (t) => { const parts = query.split(/\s+/); parts[parts.length - 1] = "#" + t; setQuery(parts.join(" ") + " "); inputRef.current?.focus(); };
  const pick = (e) => { onPick(e); setOpen(false); inputRef.current?.blur(); };
  const terms = [...words, ...tags.map((t) => "#" + t)];

  function onKeyDown(e) {
    if (e.key === "Escape") { setOpen(false); inputRef.current?.blur(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setActive((a) => Math.min(a + 1, results.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive((a) => Math.max(a - 1, 0)); }
    else if (e.key === "Enter" && results[active]) { e.preventDefault(); pick(results[active]); }
  }

  const hasQuery = tags.length || words.length;
  return (
    <div className="search" ref={wrapRef}>
      <div className="search-box">
        <Icon name="search" size={17} />
        <input ref={inputRef} type="search" value={query} placeholder="Search notes or #tags…" aria-label="Search notes and tags"
          onChange={(e) => { setQuery(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} onKeyDown={onKeyDown} />
        {query ? <button className="btn sm ghost icon-only" onClick={() => { setQuery(""); inputRef.current?.focus(); }} aria-label="Clear search"><Icon name="x" size={15} /></button> : <span className="kbd">/</span>}
      </div>

      {open && (
        <div className="search-pop" role="listbox">
          {(tagSuggestions.length > 0 || (!hasQuery && allTags.length > 0)) && (
            <div className="search-section">
              <div className="search-label">{hasQuery ? "Matching tags" : "Your tags"}</div>
              <div className="chips">
                {(tagSuggestions.length ? tagSuggestions : allTags.slice(0, 24)).map((t) => (
                  <button key={t.tag} className="tag-chip" onMouseDown={(e) => e.preventDefault()} onClick={() => (hasQuery ? completeTag(t.tag) : (setQuery("#" + t.tag + " "), inputRef.current?.focus()))}>
                    #{t.tag}<span>{t.n}</span>
                  </button>
                ))}
              </div>
            </div>
          )}
          {!hasQuery && !allTags.length && <div className="search-empty">Type a keyword, or a #tag such as #Internship.</div>}
          {hasQuery && (
            <div className="search-section" style={{ padding: 0 }}>
              <div className="search-label" style={{ padding: "12px 14px 0" }}>{results.length} result{results.length === 1 ? "" : "s"}</div>
              {results.length === 0
                ? <div className="search-empty">Nothing matches “{query.trim()}”.</div>
                : <ul className="results">
                    {results.slice(0, 60).map((e, i) => {
                      const tab = TAB_BY_ID[e.tab];
                      const snip = makeSnippet(e.body, words);
                      return (
                        <li key={e.id} role="option" aria-selected={i === active} className={`result${i === active ? " active" : ""}`}
                          onMouseEnter={() => setActive(i)} onMouseDown={(ev) => ev.preventDefault()} onClick={() => pick(e)}>
                          <div className="result-top">
                            <span className="result-date"><Icon name="calendar" size={13} />{fmtShort(e.date)}</span>
                            <span className={`tab-badge t-${e.tab}`}>{tab.en} ({tab.th})</span>
                            {e.tab === "work" && e.done && <span className="badge">Done</span>}
                          </div>
                          <div className="result-title"><Highlight text={entryLabel(e)} terms={terms} /></div>
                          {snip && e.title && <div className="result-snippet"><Highlight text={snip} terms={terms} /></div>}
                        </li>
                      );
                    })}
                  </ul>}
            </div>
          )}
        </div>
      )}
    </div>
  );
}
