/* ============================================================
   12. GLOBAL SEARCH — keywords + #tags, shows date and tab
   ============================================================ */
function parseQuery(q) {
  const tags = [], words = [];
  q.trim().split(/\s+/).filter(Boolean).forEach((tok) => {
    if (tok.startsWith("#") && tok.length > 1) tags.push(tok.slice(1).toLowerCase());
    else if (tok !== "#") words.push(tok.toLowerCase());
  });
  return { tags, words };
}
function makeSnippet(body, words) {
  const flat = (body || "").replace(/\s+/g, " ").trim();
  if (!flat) return "";
  const lower = flat.toLowerCase();
  let idx = -1;
  words.forEach((w) => { const i = lower.indexOf(w); if (i >= 0 && (idx < 0 || i < idx)) idx = i; });
  if (idx < 0) return flat.length > 130 ? flat.slice(0, 130) + "…" : flat;
  const start = Math.max(0, idx - 50);
  return (start > 0 ? "…" : "") + flat.slice(start, start + 140) + (start + 140 < flat.length ? "…" : "");
}

function SearchBar({ entries, query, setQuery, open, setOpen, inputRef, onPick }) {
  const wrapRef = useRef(null);
  const [active, setActive] = useState(0);
  const { tags, words } = useMemo(() => parseQuery(query), [query]);

  const allTags = useMemo(() => {
    const map = new Map();
    entries.forEach((e) => e.tags.forEach((t) => {
      const k = t.toLowerCase();
      map.set(k, { tag: map.get(k)?.tag || t, n: (map.get(k)?.n || 0) + 1 });
    }));
    return [...map.values()].sort((a, b) => b.n - a.n || a.tag.localeCompare(b.tag));
  }, [entries]);

  const results = useMemo(() => {
    if (!tags.length && !words.length) return [];
    const order = { work: 0, study: 1, ideas: 2 };
    return entries.filter((e) => {
      const et = e.tags.map((t) => t.toLowerCase());
      if (!tags.every((t) => et.some((x) => x.startsWith(t)))) return false;
      const hay = `${e.title}\n${e.body}\n${e.attachments.map((a) => a.name).join(" ")}`.toLowerCase();
      return words.every((w) => hay.includes(w));
    }).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : order[a.tab] - order[b.tab]));
  }, [entries, tags, words]);

  const lastTok = query.split(/\s+/).pop() || "";
  const tagSuggestions = lastTok.startsWith("#")
    ? allTags.filter((t) => t.tag.toLowerCase().startsWith(lastTok.slice(1).toLowerCase()) && t.tag.toLowerCase() !== lastTok.slice(1).toLowerCase()).slice(0, 8)
    : [];

  useEffect(() => setActive(0), [query]);
  useEffect(() => {
    const onDown = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("pointerdown", onDown);
    return () => document.removeEventListener("pointerdown", onDown);
  }, []);

  const completeTag = (t) => { const parts = query.split(/\s+/); parts[parts.length - 1] = "#" + t; setQuery(parts.join(" ") + " "); inputRef.current?.focus(); };
  const pick = (e) => { onPick(e); setOpen(false); inputRef.current?.blur(); };
  const terms = [...words, ...tags.map((t) => "#" + t)];

  function onKeyDown(e) {
    if (e.key === "Escape") { setOpen(false); inputRef.current?.blur(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setActive((a) => Math.min(a + 1, results.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive((a) => Math.max(a - 1, 0)); }
    else if (e.key === "Enter" && results[active]) { e.preventDefault(); pick(results[active]); }
  }

  const hasQuery = tags.length || words.length;
  return (
    <div className="search" ref={wrapRef}>
      <div className="search-box">
        <Icon name="search" size={17} />
        <input ref={inputRef} type="search" value={query} placeholder="Search notes or #tags…" aria-label="Search notes and tags"
          onChange={(e) => { setQuery(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} onKeyDown={onKeyDown} />
        {query ? <button className="btn sm ghost icon-only" onClick={() => { setQuery(""); inputRef.current?.focus(); }} aria-label="Clear search"><Icon name="x" size={15} /></button> : <span className="kbd">/</span>}
      </div>

      {open && (
        <div className="search-pop" role="listbox">
          {(tagSuggestions.length > 0 || (!hasQuery && allTags.length > 0)) && (
            <div className="search-section">
              <div className="search-label">{hasQuery ? "Matching tags" : "Your tags"}</div>
              <div className="chips">
                {(tagSuggestions.length ? tagSuggestions : allTags.slice(0, 24)).map((t) => (
                  <button key={t.tag} className="tag-chip" onMouseDown={(e) => e.preventDefault()} onClick={() => (hasQuery ? completeTag(t.tag) : (setQuery("#" + t.tag + " "), inputRef.current?.focus()))}>
                    #{t.tag}<span>{t.n}</span>
                  </button>
                ))}
              </div>
            </div>
          )}
          {!hasQuery && !allTags.length && <div className="search-empty">Type a keyword, or a #tag such as #Internship.</div>}
          {hasQuery && (
            <div className="search-section" style={{ padding: 0 }}>
              <div className="search-label" style={{ padding: "12px 14px 0" }}>{results.length} result{results.length === 1 ? "" : "s"}</div>
              {results.length === 0
                ? <div className="search-empty">Nothing matches “{query.trim()}”.</div>
                : <ul className="results">
                    {results.slice(0, 60).map((e, i) => {
                      const tab = TAB_BY_ID[e.tab];
                      const snip = makeSnippet(e.body, words);
                      return (
                        <li key={e.id} role="option" aria-selected={i === active} className={`result${i === active ? " active" : ""}`}
                          onMouseEnter={() => setActive(i)} onMouseDown={(ev) => ev.preventDefault()} onClick={() => pick(e)}>
                          <div className="result-top">
                            <span className="result-date"><Icon name="calendar" size={13} />{fmtShort(e.date)}</span>
                            <span className={`tab-badge t-${e.tab}`}>{tab.en} ({tab.th})</span>
                            {e.tab === "work" && e.done && <span className="badge">Done</span>}
                          </div>
                          <div className="result-title"><Highlight text={entryLabel(e)} terms={terms} /></div>
                          {snip && e.title && <div className="result-snippet"><Highlight text={snip} terms={terms} /></div>}
                        </li>
                      );
                    })}
                  </ul>}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const statusOf = (id) => WS_STATUSES.find((s) => s.id === id);
const safeHref = (u) => (/^https?:\/\//i.test(u || "") ? u : null);

function PositionBadge({ ws }) {
  const st = statusOf(ws.status);
  if (!st && ws.headcount == null) return null;
  const text = [st && st.label, ws.headcount != null && String(ws.headcount)].filter(Boolean).join(" · ");
  return <span className={`badge ws-badge ${st ? st.cls : ""}`} title={`${st ? st.label : "No status"}${ws.headcount != null ? ` · headcount ${ws.headcount}` : ""}`}>{text}</span>;
}

function WsInlineInput({ initial = "", placeholder, depth = 0, keepOpen, onSubmit, onCancel }) {
  const [v, setV] = useState(initial);
  const ref = useRef(null);
  useEffect(() => { ref.current?.focus(); ref.current?.select(); }, []);
  return (
    <div className="ws-row" style={{ paddingLeft: depth * 16 + 30 }}>
      <input ref={ref} className="ws-input" value={v} placeholder={placeholder} aria-label={placeholder}
        onChange={(e) => setV(e.target.value)} onBlur={onCancel}
        onKeyDown={(e) => {
          if (e.key === "Enter") { e.preventDefault(); const name = v.trim(); if (!name) return onCancel(); onSubmit(name); if (keepOpen) setV(""); }
          if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); onCancel(); }
        }} />
    </div>
  );
}

function WorkspaceSidebar({ navRef, open, filter, view, counts, allCount, pendingCount, onSelect, onAll, onPending, onDetails }) {
  const { workspaces, wsIdx: idx, wsActions } = useApp();
  const [collapsed, setCollapsed] = useState(() => new Set());
  const [menuFor, setMenuFor] = useState(null);
  const [edit, setEdit] = useState(null); // { mode: "add", parentId, kind } | { mode: "rename", id }
  const [showArchived, setShowArchived] = useState(false);

  const kidsOf = (id) => (idx.kids.get(id) || []).filter((w) => !w.archivedAt);
  const roots = kidsOf("");
  const archived = workspaces.filter((w) => w.archivedAt && !(w.parentId && idx.isArchived(w.parentId)))
    .sort((a, b) => a.name.localeCompare(b.name));
  const canDelete = (w) => !(idx.kids.get(w.id) || []).length && !counts.get(w.id);
  const toggle = (id) => setCollapsed((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const startAdd = (parentId, kind) => {
    setMenuFor(null);
    if (parentId) setCollapsed((s) => { const n = new Set(s); n.delete(parentId); return n; });
    setEdit({ mode: "add", parentId, kind });
  };
  const allOn = !filter && view !== "pending";
  const pendOn = !filter && view === "pending";

  const item = (label, fn) => <button key={label} type="button" className="menu-item" role="menuitem" onClick={() => { setMenuFor(null); fn(); }}>{label}</button>;
  function renderMenu(w) {
    const sibs = (idx.kids.get(w.parentId && idx.byId.has(w.parentId) ? w.parentId : "") || []).filter((x) => !x.archivedAt);
    const i = sibs.findIndex((x) => x.id === w.id);
    const live = !w.archivedAt;
    return (
      <div className="menu ws-menu" role="menu" aria-label={`${w.name} actions`}>
        {live && WS_CHILD_KINDS[w.kind].map((k) => item(`Add ${k}`, () => startAdd(w.id, k)))}
        {live && w.kind === "position" && item("Position details", () => onDetails(w))}
        {live && item("Rename", () => setEdit({ mode: "rename", id: w.id }))}
        {live && i > 0 && item("Move up", () => wsActions.move(w, sibs, -1))}
        {live && i >= 0 && i < sibs.length - 1 && item("Move down", () => wsActions.move(w, sibs, 1))}
        {item(live ? "Archive" : "Unarchive", () => wsActions.archive(w, live))}
        {canDelete(w) && item("Delete", () => wsActions.remove(w))}
      </div>
    );
  }
  function renderRow(w, depth, archivedRow) {
    if (edit && edit.mode === "rename" && edit.id === w.id) {
      return <WsInlineInput key={w.id} initial={w.name} depth={depth} placeholder={`Rename ${w.kind}`}
        onSubmit={(name) => { setEdit(null); if (name !== w.name) wsActions.save({ ...w, name, updatedAt: Date.now() }); }} onCancel={() => setEdit(null)} />;
    }
    const kids = archivedRow ? [] : kidsOf(w.id);
    const expanded = !collapsed.has(w.id);
    const on = filter === w.id;
    const n = counts.get(w.id) || 0;
    const addHere = edit && edit.mode === "add" && edit.parentId === w.id;
    return (
      <React.Fragment key={w.id}>
        <div className={`ws-row${on ? " on" : ""}${archivedRow ? " faint" : ""}`} style={{ paddingLeft: depth * 16 }}>
          {kids.length
            ? <button type="button" className="ws-chev" aria-expanded={expanded} aria-label={`${expanded ? "Collapse" : "Expand"} ${w.name}`} onClick={() => toggle(w.id)}><Icon name="chevronRight" size={15} /></button>
            : <span className="ws-chev" aria-hidden="true" />}
          <button type="button" className="ws-name" title={`${WS_KINDS[w.kind]}: ${idx.path(w.id).map((x) => x.name).join(" › ")}`}
            aria-current={on ? "true" : undefined} onClick={() => onSelect(w.id)}>{w.name}</button>
          {archivedRow ? <span className="badge ws-badge">Closed</span> : w.kind === "position" && <PositionBadge ws={w} />}
          {n > 0 && <span className="count-pill" aria-label={`${n} items`}>{n}</span>}
          <button type="button" className="btn sm ghost icon-only ws-more" aria-label={`Actions for ${w.name}`} aria-expanded={menuFor === w.id}
            onClick={() => setMenuFor((m) => (m === w.id ? null : w.id))}><Icon name="more" size={16} /></button>
        </div>
        {menuFor === w.id && renderMenu(w)}
        {expanded && kids.map((c) => renderRow(c, depth + 1))}
        {addHere && <WsInlineInput key={`add-${w.id}-${edit.kind}`} depth={depth + 1} keepOpen={edit.kind === "position"} placeholder={`New ${edit.kind} name`}
          onSubmit={(name) => { if (edit.kind !== "position") setEdit(null); wsActions.add(edit.kind, w.id, name); }} onCancel={() => setEdit(null)} />}
      </React.Fragment>
    );
  }

  return (
    <nav id="ws-nav" ref={navRef} tabIndex={-1} aria-label="Workspaces" className={`card ws-side${open ? " open" : ""}`}

// Entry editor: link an entry to one or more company / department / position nodes.
function WorkspacePicker({ value, onChange }) {
  const { workspaces, wsIdx: idx } = useApp();
  if (!workspaces.length && !value.length) return null;
  const groups = (idx.kids.get("") || []).filter((r) => !r.archivedAt).map((r) => {
    const opts = [];
    const walk = (w, depth) => { if (w.archivedAt) return; opts.push({ w, depth }); (idx.kids.get(w.id) || []).forEach((c) => walk(c, depth + 1)); };
    walk(r, 0);
    return { r, opts };
  });
  return (
    <div className="field-row">
      <div className="field" style={{ flexWrap: "wrap" }}><Icon name="briefcase" size={15} />Workspace
        {value.map((id) => {
          const path = idx.path(id);
          if (!path.length) return null; // unknown / deleted id — ignored
          const label = path.map((n) => n.name).join(" › ");
          return (
            <span key={id} className="badge ws-sel" title={label}><span>{path[path.length - 1].name}</span>
              <button type="button" aria-label={`Remove ${label}`} onClick={() => onChange(value.filter((x) => x !== id))}><Icon name="x" size={11} strokeWidth={2.4} /></button>
            </span>
          );
        })}
        {groups.length > 0 && (
          <select className="ws-select" value="" aria-label="Add workspace" onChange={(e) => { if (e.target.value) onChange([...value, e.target.value]); }}>
            <option value="">＋ Add…</option>
            {groups.map(({ r, opts }) => (
              <optgroup key={r.id} label={r.name}>
                {opts.map(({ w, depth }) => (
                  <option key={w.id} value={w.id} disabled={value.includes(w.id)}>{"   ".repeat(depth)}{w.name}{depth ? ` (${w.kind})` : ""}</option>
                ))}
              </optgroup>
            ))}
          </select>
        )}
      </div>
    </div>
  );
}

function PositionForm({ ws, onDone }) {
  const { wsActions } = useApp();
  const [headcount, setHeadcount] = useState(ws.headcount == null ? "" : String(ws.headcount));
  const [status, setStatus] = useState(ws.status || "open");
  const [openedOn, setOpenedOn] = useState(ws.openedOn || "");
  const [channels, setChannels] = useState(ws.channels);
  const [note, setNote] = useState(ws.note || "");
  const [saving, setSaving] = useState(false);
  const setCh = (i, k, v) => setChannels((cs) => cs.map((c, j) => (j === i ? { ...c, [k]: v } : c)));
  const addCh = (name) => setChannels((cs) => [...cs, { name, url: "" }]);
  async function save(e) {
    e.preventDefault(); setSaving(true);
    const clean = channels.filter((c) => c.name.trim()).map((c) => {
      let u = c.url.trim(); if (u && !/^https?:\/\//i.test(u)) u = "https://" + u;
      return { name: c.name.trim(), url: u };
    });
    const ok = await wsActions.save({ ...ws, headcount: headcount === "" ? null : headcount, status, openedOn: openedOn || null, channels: clean, note, updatedAt: Date.now() });
    setSaving(false);
    if (ok) onDone();
  }
  return (
    <form className="pos-form" onSubmit={save} aria-label="Position details" onKeyDown={(e) => { if (e.key === "Escape") { e.stopPropagation(); onDone(); } }}>
      <div className="field-row">
        <label className="field">Headcount<input type="number" min="0" inputMode="numeric" value={headcount} onChange={(e) => setHeadcount(e.target.value)} /></label>
        <div className="field">Status

            {WS_STATUSES.map((s) => <button key={s.id} type="button" role="radio" aria-checked={status === s.id} className={`${status === s.id ? "on" : ""} ${s.cls}`} onClick={() => setStatus(s.id)}>{s.label}</button>)}
          </div>
        </div>
        <label className="field">Opened<input type="date" value={openedOn} onChange={(e) => setOpenedOn(e.target.value)} /></label>
      </div>
      <div className="field">Channels</div>
      <div className="chips">
        {WS_CHANNEL_PRESETS.map((p) => (
          <button key={p} type="button" className="tag-chip" disabled={channels.some((c) => c.name.trim().toLowerCase() === p.toLowerCase())} onClick={() => addCh(p)}>＋ {p}</button>
        ))}
        <button type="button" className="tag-chip" onClick={() => addCh("")}>＋ Other</button>
      </div>
      {channels.map((c, i) => (
        <div key={i} className="link-form">
          <input value={c.name} onChange={(e) => setCh(i, "name", e.target.value)} placeholder="Channel" aria-label="Channel name" />
          <input value={c.url} onChange={(e) => setCh(i, "url", e.target.value)} placeholder="Link (optional)" aria-label={`${c.name || "Channel"} link`} inputMode="url" />
          <button type="button" className="btn sm ghost icon-only" aria-label={`Remove ${c.name || "channel"}`} onClick={() => setChannels((cs) => cs.filter((_, j) => j !== i))}><Icon name="x" size={14} /></button>
        </div>
      ))}
      <label className="field" style={{ flexDirection: "column", alignItems: "stretch", gap: 4 }}>Note
        <textarea value={note} onChange={(e) => setNote(e.target.value)} placeholder="Requirements, salary range, contact person…" />
      </label>

        <span className="spacer" />
        <button type="button" className="btn sm ghost" onClick={onDone}>Cancel</button>
        <button type="submit" className="btn sm primary" disabled={saving}>{saving ? "Saving…" : "Save"}</button>
      </div>
    </form>
  );
}

function WorkspaceSummary({ node, entries, onOpen, editing, setEditing }) {
  const { wsIdx, actions } = useApp();
  const path = wsIdx.path(node.id);
  const open = entries.filter((e) => e.tab === "work" && !e.done)
    .sort((a, b) => ((a.due || "9") < (b.due || "9") ? -1 : (a.due || "9") > (b.due || "9") ? 1 : PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority]));
  const days = useMemo(() => {
    const map = new Map();
    [...entries].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt)).forEach((e) => {
      if (!map.has(e.date)) map.set(e.date, []);
      map.get(e.date).push(e);
    });
    return [...map.entries()];
  }, [entries]);
  const go = (e) => onOpen(e.date, e.tab, e.id);
  const row = (e, withCheck) => (
    <div key={e.id} className="task-row">

        <button type="button" className="check" onClick={() => actions.toggleDone(e)} aria-label={`Mark "${entryLabel(e)}" as done`}><Icon name="check" size={14} strokeWidth={3} /></button>
      )}
      <div className="task-main" role="button" tabIndex={0} onClick={() => go(e)} onKeyDown={(ev) => { if (ev.key === "Enter") go(e); }}>
        <div className="task-title">{entryLabel(e)}</div>
        <div className="meta">
          {!withCheck && <span className={`tab-badge t-${e.tab}`}>{TAB_BY_ID[e.tab].en} ({TAB_BY_ID[e.tab].th})</span>}
          {e.tab === "work" && e.done && <span className="badge">Done</span>}
          {withCheck && <><PriorityBadge p={e.priority} /><DueBadge due={e.due} /><span className="task-src"><Icon name="calendar" size={12} />{fmtShort(e.date)}</span></>}

        </div>
      </div>
      <span className="task-open" aria-hidden="true"><Icon name="arrowRight" size={16} /></span>

  return (

      <div className="pending-head">
        <div style={{ minWidth: 0 }}>
          <div className="pending-sub" style={{ marginBottom: 2 }}>{WS_KINDS[node.kind]}{path.length > 1 ? ` · ${path.slice(0, -1).map((n) => n.name).join(" › ")}` : ""}</div>
          <h2 style={{ overflowWrap: "anywhere" }}>{node.name}</h2>
        </div>
        <span className="count-pill">{entries.length}</span>
        {wsIdx.isArchived(node.id) && <span className="badge">Closed</span>}
      </div>
      {node.kind === "position" && (editing
        ? <PositionForm key={node.id} ws={node} onDone={() => setEditing(false)} />
        : <PositionInfo ws={node} onEdit={() => setEditing(true)} />)}
      <div className="group">
        <div className="group-title">Open tasks<span className="n">{open.length}</span></div>
        {open.length ? open.map((e) => row(e, true)) : <div className="pending-sub">No open tasks here.</div>}
      </div>
      <div className="group">
        <div className="group-title">Timeline<span className="n">{entries.length}</span></div>
        {!entries.length && <div className="empty"><Icon name="briefcase" size={28} />Nothing linked yet. Notes you add while this is selected are linked automatically.</div>}
        {days.map(([date, items]) => (
          <div key={date}>
            <div className="timeline-date"><Icon name="calendar" size={13} />{fmtShort(date)}</div>
            {items.map((e) => row(e, false))}
          </div>
        ))}
      </div>
    </section>
  );
}

   15. NOTEBOOK — main screen, owns app state
   ============================================================ */
function Notebook({ store, user }) {
  const [entries, setEntries] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const initialDate = inRange(todayKey()) ? todayKey() : RANGE_START;
  const [view, setView] = useState("calendar");
  const [selected, setSelected] = useState(initialDate);
  const [tab, setTab] = useState("work");
  const [panelOpen, setPanelOpen] = useState(false);
  const [focusId, setFocusId] = useState(null);
  const [month, setMonth] = useState(() => { const d = fromKey(initialDate); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [query, setQuery] = useState("");
  const [searchOpen, setSearchOpen] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [lightbox, setLightbox] = useState(null);
  const searchRef = useRef(null);
  const [workspaces, setWorkspaces] = useState([]);
  const [wsLoaded, setWsLoaded] = useState(false);
  const [wsFilter, setWsFilter] = useState(() => { try { return localStorage.getItem(WS_FILTER_KEY) || null; } catch { return null; } });
  const [wsOpen, setWsOpen] = useState(false);
  const [posEditing, setPosEditing] = useState(false);
  const burgerRef = useRef(null);
  const wsNavRef = useRef(null);
  const wsOpenRef = useRef(false);
  wsOpenRef.current = wsOpen;
  const entriesRef = useRef(entries);
  entriesRef.current = entries;

  const toast = useCallback((msg, kind = "info", action = null) => {
    const id = uid();
    setToasts((t) => [...t.slice(-2), { id, msg, kind, action }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), action ? 6000 : 4000);
  }, []);

  useEffect(() => {
    setLoaded(false);
    const unsub = store.subscribe(
      (list) => { setEntries(list.map(normalizeEntry)); setLoaded(true); },
      (err) => { setLoaded(true); toast(err.code === "permission-denied" ? "Firestore blocked access — check your security rules." : err.code === "42501" ? "Supabase blocked access — check the row-level security policies." : err.message, "error"); }
    );
    return unsub;
  }, [store]);

  useEffect(() => {
    setWsLoaded(false);
    return store.subscribeWorkspaces(
      (list) => { setWorkspaces(list.map(normalizeWorkspace)); setWsLoaded(true); },
      (err) => { setWsLoaded(true); toast(err.code === "SCHEMA_MISSING" ? SCHEMA_MSG : err.message, "error"); }
    );
  }, [store]);

  const wsIdx = useMemo(() => buildWsIndex(workspaces), [workspaces]);
  const wsIdxRef = useRef(wsIdx);
  wsIdxRef.current = wsIdx;
  // Forget a remembered filter whose node no longer exists.
  useEffect(() => { if (wsLoaded && wsFilter && !wsIdx.byId.has(wsFilter)) setWsFilter(null); }, [wsLoaded, wsIdx, wsFilter]);
  useEffect(() => { try { wsFilter ? localStorage.setItem(WS_FILTER_KEY, wsFilter) : localStorage.removeItem(WS_FILTER_KEY); } catch {} }, [wsFilter]);
  useEffect(() => { if (!wsFilter && view === "summary") setView("calendar"); }, [wsFilter, view]);

  const filterNode = wsFilter ? wsIdx.byId.get(wsFilter) || null : null;
  const visible = useMemo(() => {
    if (!filterNode) return entries;
    const set = wsIdx.descendants(filterNode.id);
    return entries.filter((e) => e.workspaceIds.some((id) => set.has(id)));
  }, [entries, wsIdx, filterNode]);
  // Items per node, counting the node itself and everything below it (unknown ids are ignored).
  const wsCounts = useMemo(() => {
    const m = new Map();
    entries.forEach((e) => {
      const hit = new Set();
      e.workspaceIds.forEach((id) => wsIdx.path(id).forEach((n) => hit.add(n.id)));
      hit.forEach((id) => m.set(id, (m.get(id) || 0) + 1));
    });
    return m;
  }, [entries, wsIdx]);

  const isDrawer = () => window.matchMedia("(max-width: 1180px)").matches;
  const closeWs = () => { setWsOpen(false); burgerRef.current?.focus(); };
  const openWs = () => { setPanelOpen(false); setWsOpen(true); requestAnimationFrame(() => wsNavRef.current?.focus()); };
  function selectWs(id) {
    setWsFilter(id); setPosEditing(false);
    if (wsOpenRef.current && isDrawer()) closeWs();
  }

  // Lock page scroll while a mobile drawer is open
  useEffect(() => {
    document.body.classList.toggle("lock", (panelOpen && window.matchMedia("(max-width: 899px)").matches) || (wsOpen && isDrawer()));
  }, [panelOpen, wsOpen]);

  // Keyboard: "/" focuses search, Esc closes overlays
  useEffect(() => {
    const onKey = (e) => {
      const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
      if (e.key === "/" && !typing) { e.preventDefault(); searchRef.current?.focus(); }
      if (e.key === "Escape" && !typing) {
        setLightbox(null); setPanelOpen(false);
        if (wsOpenRef.current) { setWsOpen(false); burgerRef.current?.focus(); }
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const byDate = useMemo(() => {
    const map = new Map();
    visible.forEach((e) => {
      if (!map.has(e.date)) map.set(e.date, { work: 0, study: 0, ideas: 0, total: 0, open: 0 });
      const c = map.get(e.date); c[e.tab]++; c.total++; if (e.tab === "work" && !e.done) c.open++;
    });
    return map;
  }, [visible]);
  const pendingCount = useMemo(() => entries.filter((e) => e.tab === "work" && !e.done).length, [entries]);
  const visiblePending = useMemo(() => visible.filter((e) => e.tab === "work" && !e.done).length, [visible]);

  function selectDate(k) {
    if (!inRange(k)) return;
    setSelected(k); setFocusId(null); setPanelOpen(true);
    const d = fromKey(k); setMonth({ y: d.getFullYear(), m: d.getMonth() });
  }
  function openEntry(date, tabId, entryId) {
    selectDate(date); setTab(tabId); setFocusId(entryId);
    setTimeout(() => setFocusId(null), 2200);
  }

  const actions = useMemo(() => ({
    save: async (e) => { await store.save(normalizeEntry(e)); },
    async toggleDone(e) {
      const next = normalizeEntry({ ...e, done: !e.done, doneAt: e.done ? null : Date.now(), updatedAt: Date.now() });
      try {
        await store.save(next);
        if (next.done) toast(`Done: ${entryLabel(next)}`, "info", { label: "Undo", fn: () => store.save(normalizeEntry({ ...next, done: false, updatedAt: Date.now() })) });
      } catch (err) { toast(err.message, "error"); }
    },
    async remove(e) {
      if (!window.confirm(`Delete this ${TAB_BY_ID[e.tab].noun}? This can't be undone.`)) return;
      try {
        await Promise.all(e.attachments.map((a) => store.removeFile(a).catch(() => {})));
        await store.remove(e.id);
        toast("Deleted");
      } catch (err) { toast(err.message, "error"); }
    },
    async toggleCheck(e, itemId) {
      const next = normalizeEntry({ ...e, checklist: e.checklist.map((c) => (c.id === itemId ? { ...c, done: !c.done } : c)), updatedAt: Date.now() });
      try { await store.save(next); } catch (err) { toast(err.message, "error"); }
    },
  }), [store, toast]);

  // Workspace actions — hierarchy rules are enforced here (client-side).
  const wsActions = useMemo(() => {
    const save = async (w) => {
      try { await store.saveWorkspace(normalizeWorkspace(w)); return true; }
      catch (err) { toast(err.message || "Could not save", "error"); return false; }
    };
    return {
      save,
      add(kind, parentId, name) {
        const idx = wsIdxRef.current;
        const parent = parentId ? idx.byId.get(parentId) : null;
        if (!wsParentOk(kind, parent)) return toast(`A ${kind} can't be added there.`, "error");
        const sibs = idx.kids.get(parent ? parent.id : "") || [];
        const now = Date.now();
        return save({ id: uid(), kind, parentId: parent ? parent.id : null, name, sort: sibs.reduce((m, s) => Math.max(m, s.sort), -1) + 1, createdAt: now, updatedAt: now });
      },
      async archive(w, on) {
        const ok = await save({ ...w, archivedAt: on ? Date.now() : null, updatedAt: Date.now() });
        if (ok && on) toast(`Archived: ${w.name}`, "info", { label: "Undo", fn: () => save({ ...w, archivedAt: null, updatedAt: Date.now() }) });
      },
      async remove(w) {
        if ((wsIdxRef.current.kids.get(w.id) || []).length || entriesRef.current.some((e) => e.workspaceIds.includes(w.id))) {
          return toast("This still has items inside — archive it instead.", "error");
        }
        if (!window.confirm(`Delete “${w.name}”? This can't be undone.`)) return;
        try { await store.removeWorkspace(w.id); toast("Deleted"); } catch (err) { toast(err.message, "error"); }
      },
      move(w, sibs, dir) {
        const i = sibs.findIndex((x) => x.id === w.id), j = i + dir;
        if (i < 0 || j < 0 || j >= sibs.length) return;
        const order = [...sibs];
        [order[i], order[j]] = [order[j], order[i]];
        const now = Date.now();
        const changed = order.map((x, k) => (x.sort === k ? null : normalizeWorkspace({ ...x, sort: k, updatedAt: now }))).filter(Boolean);
        store.saveWorkspaces(changed).catch((err) => toast(err.message, "error"));
      },
    };
  }, [store, toast]);

  async function exportBackup() {
    try {
      toast("Preparing backup…");
      const files = {};
      for (const e of entries) for (const a of e.attachments) {
        try { const b = await store.getFileBlob(a); if (b) files[a.id] = await blobToDataURL(b); } catch {}
      }
      const data = { app: "second-brain-notebook", version: 2, exportedAt: new Date().toISOString(), range: [RANGE_START, RANGE_END], entries, workspaces, files };
      downloadBlob(new Blob([JSON.stringify(data)], { type: "application/json" }), `second-brain-backup-${todayKey()}.json`);
    } catch (err) { toast("Export failed: " + err.message, "error"); }
  }
  async function importBackup(file) {
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.entries)) throw new Error("This is not a Second Brain backup file.");
      const valid = data.entries.filter((e) => e && e.id && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && TAB_BY_ID[e.tab]);
      const wsValid = Array.isArray(data.workspaces)
        ? data.workspaces.filter((w) => w && w.id && WS_KINDS[w.kind] && String(w.name || "").trim()).map(normalizeWorkspace) : [];
      if (!window.confirm(`Import ${valid.length} item(s)${wsValid.length ? ` and ${wsValid.length} workspace(s)` : ""}? Items with the same ID will be replaced; everything else stays.`)) return;
      toast("Importing…");
      if (wsValid.length) { try { await store.saveWorkspaces(wsValid); } catch (err) { toast(err.message, "error"); } }
      const files = data.files || {};
      let missing = 0;
      const out = [];
      for (const e of valid) {
        const atts = [];
        for (const a of e.attachments || []) {
          if (files[a.id]) {
            try { atts.push(await store.putFileWithId(a, dataURLToBlob(files[a.id]))); } catch { missing++; }
          } else if (a.url) atts.push(a);
          else missing++;
        }
        out.push(normalizeEntry({ ...e, attachments: atts }));
      }
      await store.saveMany(out);
      toast(`Imported ${out.length} item${out.length === 1 ? "" : "s"}${missing ? ` (${missing} attachment${missing > 1 ? "s" : ""} skipped)` : ""}.`);
    } catch (err) { toast("Import failed: " + err.message, "error"); }
  }
  async function addSample() {
    try { await store.saveMany(sampleEntries()); toast("Added 10 sample notes. Try searching #Internship."); }
    catch (err) { toast(err.message, "error"); }
  }

  const ctx = useMemo(() => ({
    store, toast, actions, workspaces, wsIdx, wsFilter: filterNode ? filterNode.id : null, wsActions,
    openImage: setLightbox,
    onTag: (t) => { setQuery(t + " "); setSearchOpen(true); setTimeout(() => searchRef.current?.focus(), 0); },
  }), [store, toast, actions, workspaces, wsIdx, filterNode, wsActions]);
  const filterLabel = filterNode ? wsIdx.path(filterNode.id).map((n) => n.name).join(" › ") : "";

  return (
    <AppCtx.Provider value={ctx}>
      <header className="topbar">
        <div className="topbar-inner">
          <button ref={burgerRef} type="button" className="btn ghost icon-only ws-burger" onClick={openWs}
            aria-label="Workspaces" aria-expanded={wsOpen} aria-controls="ws-nav"><Icon name="menu" /></button>
          <div className="brand">
            <div className="brand-mark"><Icon name="brain" size={18} strokeWidth={2.2} /></div>
            <div><div className="brand-name">Second Brain</div><div className="brand-sub">Internship notebook · 6 Nov 2026 – 5 Mar 2027</div></div>
          </div>
          <SearchBar entries={visible} query={query} setQuery={setQuery} open={searchOpen} setOpen={setSearchOpen}
            inputRef={searchRef} onPick={(e) => openEntry(e.date, e.tab, e.id)} />
          {filterNode && (
            <div className="ws-chip">
              <button type="button" className="ws-chip-main" title={`Show summary · ${filterLabel}`} onClick={() => setView("summary")}>{filterLabel}</button>
              <button type="button" className="x" aria-label="Clear workspace filter" onClick={() => selectWs(null)}><Icon name="x" size={13} strokeWidth={2.2} /></button>
            </div>
          )}
          <nav className="nav">
            <button className={`btn ghost${view === "calendar" ? " active" : ""}`} onClick={() => setView("calendar")} aria-label="Calendar">
              <Icon name="calendar" /><span className="label">Calendar</span>
            </button>
            <button className={`btn ghost${view === "pending" ? " active" : ""}`} onClick={() => setView("pending")} aria-label={`Pending tasks, ${visiblePending}`}>
              <Icon name="list" /><span className="label">Pending</span>{visiblePending > 0 && <span className="count-pill">{visiblePending}</span>}
            </button>
            <button className={`btn ghost${view === "building" ? " active" : ""}`} onClick={() => setView("building")} aria-label="Building details (รายละเอียดตึก)">
              <Icon name="building" /><span className="label">Building</span>
            </button>
            {filterNode && (
              <button className={`btn ghost${view === "summary" ? " active" : ""}`} onClick={() => setView("summary")} aria-label={`Summary of ${filterNode.name}`}>
                <Icon name="file" /><span className="label">Summary</span>
              </button>
            )}
            <Menu user={user} onExport={exportBackup} onImport={importBackup} onSample={addSample} />
          </nav>
        </div>
      </header>

      <main className="layout">
        {wsOpen && <div className="backdrop ws" onClick={closeWs} />}
        <WorkspaceSidebar navRef={wsNavRef} open={wsOpen} filter={filterNode ? filterNode.id : null} view={view} counts={wsCounts}
          allCount={entries.length} pendingCount={pendingCount} onSelect={selectWs}
          onAll={() => { selectWs(null); setView("calendar"); }}
          onPending={() => { selectWs(null); setView("pending"); }}
          onDetails={(w) => { selectWs(w.id); setView("summary"); setPosEditing(true); }} />
        <div>
          {!loaded
            ? <div className="card empty"><span className="spinner" style={{ margin: "0 auto" }} /></div>
            : view === "building"
              ? <BuildingView />
              : view === "summary" && filterNode
              ? <WorkspaceSummary node={filterNode} entries={visible} onOpen={openEntry} editing={posEditing} setEditing={setPosEditing} />
              : view === "pending"
                ? <PendingTasks entries={visible} onOpen={openEntry} />
                : <Calendar month={month} setMonth={setMonth} selected={selected} onSelect={selectDate} byDate={byDate} />}
        </div>
        {panelOpen && <div className="backdrop" onClick={() => setPanelOpen(false)} />}
        <DailyPanel date={selected} tab={tab} setTab={setTab} entries={visible} open={panelOpen}
          onClose={() => setPanelOpen(false)} onDateChange={selectDate} focusId={focusId} />
      </main>

      <div className="toasts" aria-live="polite">
        {toasts.map((t) => (
          <div key={t.id} className={`toast ${t.kind}`}>
            <span style={{ flex: 1 }}>{t.msg}</span>
            {t.action && <button onClick={() => { t.action.fn(); setToasts((x) => x.filter((y) => y.id !== t.id)); }}>{t.action.label}</button>}
          </div>
        ))}
      </div>
      {lightbox && (
        <div className="lightbox" onClick={() => setLightbox(null)}>
          <img src={lightbox} alt="" />
          <button className="btn icon-only" onClick={() => setLightbox(null)} aria-label="Close image"><Icon name="x" /></button>
        </div>
      )}
    </AppCtx.Provider>
  );
}

/* ============================================================
   16. AUTH SCREEN — Google or email / password (Firebase mode only)
   ============================================================ */
const AUTH_MESSAGES = {
  "auth/invalid-credential": "Email or password is incorrect.",
  "auth/wrong-password": "Email or password is incorrect.",
  "auth/user-not-found": "No account with that email. Create one below.",
  "auth/email-already-in-use": "An account with this email already exists. Sign in instead.",
  "auth/weak-password": "Password needs at least 6 characters.",
  "auth/invalid-email": "That email address doesn't look right.",
  "auth/too-many-requests": "Too many attempts. Wait a minute and try again.",
  "auth/unauthorized-domain": "This website isn't allowed yet. Add its domain in Firebase → Authentication → Settings → Authorized domains.",
  "auth/operation-not-allowed": "This sign-in method isn't enabled in Firebase yet.",
  "auth/network-request-failed": "Network error. Check your connection.",
};
// Supabase: email + password with email confirmation. `recovery` = arrived from a password-reset link.
const SB_REDIRECT = location.origin + location.pathname;
function sbAuthText(e) {
  const m = (e && e.message) || "Something went wrong.";
  if (/invalid login credentials/i.test(m)) return "Wrong email or password.";
  if (/already registered/i.test(m)) return "An account with this email already exists. Sign in instead.";
  if (/rate limit|too many/i.test(m)) return "Too many attempts. Wait a minute and try again.";
  return m;
}
// Invite-only: accounts are created by the owner in the Supabase dashboard — no sign-up from the app.
function SupabaseAuth({ recovery, onRecovered }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(SB_LINK_ERROR ? { kind: "error", text: SB_LINK_ERROR } : null);
  const fail = (e) => setMsg({ kind: "error", text: sbAuthText(e) });

  async function resend() {
    const { error } = await sb.auth.resend({ type: "signup", email: email.trim(), options: { emailRedirectTo: SB_REDIRECT } });
    setMsg(error ? { kind: "error", text: sbAuthText(error) } : { kind: "info", text: "Confirmation email sent. Click the link in it, then sign in." });
  }
  async function submit(e) {
    e.preventDefault(); setMsg(null);
    if (password.length < 6) return setMsg({ kind: "error", text: "Password needs at least 6 characters." });
    setBusy(true);
    try {
      if (recovery) {
        const { error } = await sb.auth.updateUser({ password });
        if (error) return fail(error);
        onRecovered();
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
        if (error && /email not confirmed/i.test(error.message || "")) {
          setMsg({ kind: "error", text: "Please confirm your email first — click the link we sent you.", action: { label: "Resend confirmation email", fn: resend } });
        } else if (error) fail(error);
      }
    } catch (err) { fail(err); } finally { setBusy(false); }
  }
  async function reset() {
    if (!email.trim()) return setMsg({ kind: "error", text: "Type your email first, then tap “Forgot password?”." });
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: SB_REDIRECT });
    setMsg(error ? { kind: "error", text: sbAuthText(error) } : { kind: "info", text: "Password reset email sent. Open the link in it to set a new password." });
  }

  return (
    <div className="auth">
      <div className="card auth-card">
        <div className="brand">
          <div className="brand-mark"><Icon name="brain" size={18} strokeWidth={2.2} /></div>
          <div><div className="brand-name">Second Brain</div><div className="brand-sub">Internship notebook</div></div>
        </div>
        <h1>{recovery ? "Set a new password" : "Welcome back"}</h1>
        <p className="lead">{recovery ? "Your notes sync across desktop, iPad and phone." : "บัญชีสร้างโดยผู้ดูแลเท่านั้น · Accounts are created by the owner only."}</p>
        <form className="auth-form" onSubmit={submit}>
          {!recovery && <label>Email<input type="email" autoComplete="email" required value={email} onChange={(e) => setEmail(e.target.value)} /></label>}
          <label>{recovery ? "New password" : "Password"}<input type="password" autoComplete={recovery ? "new-password" : "current-password"} required minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} /></label>
          {msg && <div className={`auth-msg ${msg.kind}`}>{msg.text}{msg.action && <> <button type="button" className="linklike" onClick={msg.action.fn}>{msg.action.label}</button></>}</div>}
          <button className="btn primary" type="submit" disabled={busy}>{busy ? "Please wait…" : recovery ? "Save new password" : "Sign in"}</button>
        </form>
        {!recovery && <div className="auth-switch"><button className="linklike" onClick={reset}>Forgot password?</button></div>}
      </div>
    </div>
  );
}

function AuthScreen() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const auth = firebase.auth();
  const fail = (e) => { if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") setMsg({ kind: "error", text: AUTH_MESSAGES[e.code] || e.message }); };

  async function google() {
    setMsg(null); setBusy(true);
    const provider = new firebase.auth.GoogleAuthProvider();
    try { await auth.signInWithPopup(provider); }
    catch (e) {
      if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") await auth.signInWithRedirect(provider).catch(fail);
      else fail(e);
    } finally { setBusy(false); }
  }
  async function submit(e) {
    e.preventDefault(); setMsg(null); setBusy(true);
    try {
      if (mode === "signin") await auth.signInWithEmailAndPassword(email.trim(), password);
      else await auth.createUserWithEmailAndPassword(email.trim(), password);
    } catch (err) { fail(err); } finally { setBusy(false); }
  }
  async function reset() {
    if (!email.trim()) return setMsg({ kind: "error", text: "Type your email first, then tap “Forgot password”." });
    try { await auth.sendPasswordResetEmail(email.trim()); setMsg({ kind: "info", text: "Password reset email sent." }); } catch (e) { fail(e); }
  }

  return (
    <div className="auth">
      <div className="card auth-card">
        <div className="brand">
          <div className="brand-mark"><Icon name="brain" size={18} strokeWidth={2.2} /></div>
          <div><div className="brand-name">Second Brain</div><div className="brand-sub">Internship notebook</div></div>
        </div>
        <h1>{mode === "signin" ? "Welcome back" : "Create your account"}</h1>
        <p className="lead">Your notes sync across desktop, iPad and phone.</p>
        <button className="btn" style={{ width: "100%", height: 44 }} onClick={google} disabled={busy}>
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
          Continue with Google
        </button>
        <div className="divider">or with email</div>
        <form className="auth-form" onSubmit={submit}>
          <label>Email<input type="email" autoComplete="email" required value={email} onChange={(e) => setEmail(e.target.value)} /></label>
          <label>Password<input type="password" autoComplete={mode === "signin" ? "current-password" : "new-password"} required minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} /></label>
          {msg && <div className={`auth-msg ${msg.kind}`}>{msg.text}</div>}
          <button className="btn primary" type="submit" disabled={busy}>{busy ? "Please wait…" : mode === "signin" ? "Sign in" : "Create account"}</button>
        </form>
        <div className="auth-switch">
          {mode === "signin"
            ? <>New here? <button className="linklike" onClick={() => { setMode("signup"); setMsg(null); }}>Create an account</button> · <button className="linklike" onClick={reset}>Forgot password</button></>
            : <>Already have an account? <button className="linklike" onClick={() => { setMode("signin"); setMsg(null); }}>Sign in</button></>}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   17. APP ROOT — picks Supabase, Firebase, or demo (local) mode
   ============================================================ */
function App() {
  const [user, setUser] = useState(CLOUD_ENABLED ? undefined : null); // undefined = still checking
  // Supabase password-reset link — but never when the link carried an auth error (expired/invalid).
  const [recovery, setRecovery] = useState(SUPABASE_ENABLED && SB_RECOVERY_LINK && !SB_LINK_ERROR);
  useEffect(() => {
    if (SUPABASE_ENABLED) {
      let recoveryEvent = false; // PASSWORD_RECOVERY seen in this flow
      let hadSession = false;    // a session existed before any later SIGNED_IN (e.g. from a valid reset link)
      sb.auth.getSession().then(({ data }) => {
        if (data.session) hadSession = true;
        setUser((data.session && data.session.user) || null);
      }).catch(() => setUser(null));
      const { data } = sb.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") { recoveryEvent = true; setRecovery(true); }
        if (event === "SIGNED_OUT") { recoveryEvent = false; hadSession = false; setRecovery(false); }
        // A fresh normal sign-in (no prior session, no recovery event) is not a password reset.
        if (event === "SIGNED_IN" && !recoveryEvent && !hadSession) setRecovery(false);
        if (session && event !== "SIGNED_OUT") hadSession = true;
        setUser((session && session.user) || null);
      });
      return () => data.subscription.unsubscribe();
    }
    if (FIREBASE_ENABLED) return firebase.auth().onAuthStateChanged((u) => setUser(u));
  }, []);
  const userKey = user ? user.uid || user.id : null;
  const store = useMemo(() => (SUPABASE_ENABLED ? (user ? createSupabaseStore(sb, user) : null)
    : FIREBASE_ENABLED ? (user ? createFirebaseStore(user) : null) : createLocalStore()), [userKey]);

  if (CLOUD_ENABLED && user === undefined) return <div className="boot">Loading your notebook…</div>;
  if (SUPABASE_ENABLED && (!user || recovery)) return <SupabaseAuth recovery={Boolean(user && recovery)} onRecovered={() => setRecovery(false)} />;
  if (CLOUD_ENABLED && !user) return <AuthScreen />;
  return <Notebook key={userKey || "local"} store={store} user={user} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
