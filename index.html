/* ============================================================
   15. NOTEBOOK — main screen, owns app state
   ============================================================ */
function Notebook({ store, user }) {
  const [entries, setEntries] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const initialDate = inRange(todayKey()) ? todayKey() : RANGE_START;
  const [view, setView] = useState("calendar");
  const [selected, setSelected] = useState(initialDate);
  const [tab, setTab] = useState("work");
  const [panelOpen, setPanelOpen] = useState(false);
  const [focusId, setFocusId] = useState(null);
  const [month, setMonth] = useState(() => { const d = fromKey(initialDate); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [query, setQuery] = useState("");
  const [searchOpen, setSearchOpen] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [lightbox, setLightbox] = useState(null);
  const searchRef = useRef(null);

  const toast = useCallback((msg, kind = "info", action = null) => {
    const id = uid();
    setToasts((t) => [...t.slice(-2), { id, msg, kind, action }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), action ? 6000 : 4000);
  }, []);

  useEffect(() => {
    setLoaded(false);
    const unsub = store.subscribe(
      (list) => { setEntries(list.map(normalizeEntry)); setLoaded(true); },
      (err) => { setLoaded(true); toast(err.code === "permission-denied" ? "Firestore blocked access — check your security rules." : err.code === "42501" ? "Supabase blocked access — check the row-level security policies." : err.message, "error"); }
    );
    return unsub;
  }, [store]);

  // Lock page scroll while the mobile drawer is open
  useEffect(() => { document.body.classList.toggle("lock", panelOpen && window.matchMedia("(max-width: 899px)").matches); }, [panelOpen]);

  // Keyboard: "/" focuses search, Esc closes overlays
  useEffect(() => {
    const onKey = (e) => {
      const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
      if (e.key === "/" && !typing) { e.preventDefault(); searchRef.current?.focus(); }
      if (e.key === "Escape" && !typing) { setLightbox(null); setPanelOpen(false); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const byDate = useMemo(() => {
    const map = new Map();
    entries.forEach((e) => {
      if (!map.has(e.date)) map.set(e.date, { work: 0, study: 0, ideas: 0, total: 0, open: 0 });
      const c = map.get(e.date); c[e.tab]++; c.total++; if (e.tab === "work" && !e.done) c.open++;
    });
    return map;
  }, [entries]);
  const pendingCount = useMemo(() => entries.filter((e) => e.tab === "work" && !e.done).length, [entries]);

  function selectDate(k) {
    if (!inRange(k)) return;
    setSelected(k); setFocusId(null); setPanelOpen(true);
    const d = fromKey(k); setMonth({ y: d.getFullYear(), m: d.getMonth() });
  }
  function openEntry(date, tabId, entryId) {
    selectDate(date); setTab(tabId); setFocusId(entryId);
    setTimeout(() => setFocusId(null), 2200);
  }

  const actions = useMemo(() => ({
    save: async (e) => { await store.save(normalizeEntry(e)); },
    async toggleDone(e) {
      const next = normalizeEntry({ ...e, done: !e.done, doneAt: e.done ? null : Date.now(), updatedAt: Date.now() });
      try {
        await store.save(next);
        if (next.done) toast(`Done: ${entryLabel(next)}`, "info", { label: "Undo", fn: () => store.save(normalizeEntry({ ...next, done: false, updatedAt: Date.now() })) });
      } catch (err) { toast(err.message, "error"); }
    },
    async remove(e) {
      if (!window.confirm(`Delete this ${TAB_BY_ID[e.tab].noun}? This can't be undone.`)) return;
      try {
        await Promise.all(e.attachments.map((a) => store.removeFile(a).catch(() => {})));
        await store.remove(e.id);
        toast("Deleted");
      } catch (err) { toast(err.message, "error"); }
    },
  }), [store, toast]);

  async function exportBackup() {
    try {
      toast("Preparing backup…");
      const files = {};
      for (const e of entries) for (const a of e.attachments) {
        try { const b = await store.getFileBlob(a); if (b) files[a.id] = await blobToDataURL(b); } catch {}
      }
      const data = { app: "second-brain-notebook", version: 1, exportedAt: new Date().toISOString(), range: [RANGE_START, RANGE_END], entries, files };
      downloadBlob(new Blob([JSON.stringify(data)], { type: "application/json" }), `second-brain-backup-${todayKey()}.json`);
    } catch (err) { toast("Export failed: " + err.message, "error"); }
  }
  async function importBackup(file) {
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.entries)) throw new Error("This is not a Second Brain backup file.");
      const valid = data.entries.filter((e) => e && e.id && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && TAB_BY_ID[e.tab]);
      if (!window.confirm(`Import ${valid.length} item(s)? Items with the same ID will be replaced; everything else stays.`)) return;
      toast("Importing…");
      const files = data.files || {};
      let missing = 0;
      const out = [];
      for (const e of valid) {
        const atts = [];
        for (const a of e.attachments || []) {
          if (files[a.id]) {
            try { atts.push(await store.putFileWithId(a, dataURLToBlob(files[a.id]))); } catch { missing++; }
          } else if (a.url) atts.push(a);
          else missing++;
        }
        out.push(normalizeEntry({ ...e, attachments: atts }));
      }
      await store.saveMany(out);
      toast(`Imported ${out.length} item${out.length === 1 ? "" : "s"}${missing ? ` (${missing} attachment${missing > 1 ? "s" : ""} skipped)` : ""}.`);
    } catch (err) { toast("Import failed: " + err.message, "error"); }
  }
  async function addSample() {
    try { await store.saveMany(sampleEntries()); toast("Added 10 sample notes. Try searching #Internship."); }
    catch (err) { toast(err.message, "error"); }
  }

  const ctx = useMemo(() => ({
    store, toast, actions,
    openImage: setLightbox,
    onTag: (t) => { setQuery(t + " "); setSearchOpen(true); setTimeout(() => searchRef.current?.focus(), 0); },
  }), [store, toast, actions]);

  return (
    <AppCtx.Provider value={ctx}>
      <header className="topbar">
        <div className="topbar-inner">
          <div className="brand">
            <div className="brand-mark"><Icon name="brain" size={18} strokeWidth={2.2} /></div>
            <div><div className="brand-name">Second Brain</div><div className="brand-sub">Internship notebook · 6 Nov 2026 – 5 Mar 2027</div></div>
          </div>
          <SearchBar entries={entries} query={query} setQuery={setQuery} open={searchOpen} setOpen={setSearchOpen}
            inputRef={searchRef} onPick={(e) => openEntry(e.date, e.tab, e.id)} />
          <nav className="nav">
            <button className={`btn ghost${view === "calendar" ? " active" : ""}`} onClick={() => setView("calendar")} aria-label="Calendar">
              <Icon name="calendar" /><span className="label">Calendar</span>
            </button>
            <button className={`btn ghost${view === "pending" ? " active" : ""}`} onClick={() => setView("pending")} aria-label={`Pending tasks, ${pendingCount}`}>
              <Icon name="list" /><span className="label">Pending</span>{pendingCount > 0 && <span className="count-pill">{pendingCount}</span>}
            </button>
            <Menu user={user} onExport={exportBackup} onImport={importBackup} onSample={addSample} />
          </nav>
        </div>
      </header>

      <main className="layout">
        <div>
          {!loaded
            ? <div className="card empty"><span className="spinner" style={{ margin: "0 auto" }} /></div>
            : view === "calendar"
              ? <Calendar month={month} setMonth={setMonth} selected={selected} onSelect={selectDate} byDate={byDate} />
              : <PendingTasks entries={entries} onOpen={openEntry} />}
        </div>
        {panelOpen && <div className="backdrop" onClick={() => setPanelOpen(false)} />}
        <DailyPanel date={selected} tab={tab} setTab={setTab} entries={entries} open={panelOpen}
          onClose={() => setPanelOpen(false)} onDateChange={selectDate} focusId={focusId} />
      </main>

      <div className="toasts" aria-live="polite">
        {toasts.map((t) => (
          <div key={t.id} className={`toast ${t.kind}`}>
            <span style={{ flex: 1 }}>{t.msg}</span>
            {t.action && <button onClick={() => { t.action.fn(); setToasts((x) => x.filter((y) => y.id !== t.id)); }}>{t.action.label}</button>}
          </div>
        ))}
      </div>
      {lightbox && (
        <div className="lightbox" onClick={() => setLightbox(null)}>
          <img src={lightbox} alt="" />
          <button className="btn icon-only" onClick={() => setLightbox(null)} aria-label="Close image"><Icon name="x" /></button>
        </div>
      )}
    </AppCtx.Provider>
  );
}

/* ============================================================
   16. AUTH SCREEN — Google or email / password (Firebase mode only)
   ============================================================ */
const AUTH_MESSAGES = {
  "auth/invalid-credential": "Email or password is incorrect.",
  "auth/wrong-password": "Email or password is incorrect.",
  "auth/user-not-found": "No account with that email. Create one below.",
  "auth/email-already-in-use": "An account with this email already exists. Sign in instead.",
  "auth/weak-password": "Password needs at least 6 characters.",
  "auth/invalid-email": "That email address doesn't look right.",
  "auth/too-many-requests": "Too many attempts. Wait a minute and try again.",
  "auth/unauthorized-domain": "This website isn't allowed yet. Add its domain in Firebase → Authentication → Settings → Authorized domains.",
  "auth/operation-not-allowed": "This sign-in method isn't enabled in Firebase yet.",
  "auth/network-request-failed": "Network error. Check your connection.",
};
// Supabase: email + password with email confirmation. `recovery` = arrived from a password-reset link.
const SB_REDIRECT = location.origin + location.pathname;
function sbAuthText(e) {
  const m = (e && e.message) || "Something went wrong.";
  if (/invalid login credentials/i.test(m)) return "Wrong email or password.";
  if (/already registered/i.test(m)) return "An account with this email already exists. Sign in instead.";
  if (/rate limit|too many/i.test(m)) return "Too many attempts. Wait a minute and try again.";
  return m;
}
function SupabaseAuth({ recovery, onRecovered }) {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(SB_LINK_ERROR ? { kind: "error", text: SB_LINK_ERROR } : null);
  const fail = (e) => setMsg({ kind: "error", text: sbAuthText(e) });

  async function resend() {
    const { error } = await sb.auth.resend({ type: "signup", email: email.trim(), options: { emailRedirectTo: SB_REDIRECT } });
    setMsg(error ? { kind: "error", text: sbAuthText(error) } : { kind: "info", text: "Confirmation email sent. Click the link in it, then sign in." });
  }
  async function submit(e) {
    e.preventDefault(); setMsg(null);
    if (password.length < 6) return setMsg({ kind: "error", text: "Password needs at least 6 characters." });
    setBusy(true);
    try {
      if (recovery) {
        const { error } = await sb.auth.updateUser({ password });
        if (error) return fail(error);
        onRecovered();
      } else if (mode === "signin") {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
        if (error && /email not confirmed/i.test(error.message || "")) {
          setMsg({ kind: "error", text: "Please confirm your email first — click the link we sent you.", action: { label: "Resend confirmation email", fn: resend } });
        } else if (error) fail(error);
      } else {
        const { data, error } = await sb.auth.signUp({ email: email.trim(), password, options: { emailRedirectTo: SB_REDIRECT } });
        if (error) return fail(error);
        if (!data.session) { setMode("signin"); setPassword(""); setMsg({ kind: "info", text: "Check your email to confirm your account, then sign in." }); }
      }
    } catch (err) { fail(err); } finally { setBusy(false); }
  }
  async function reset() {
    if (!email.trim()) return setMsg({ kind: "error", text: "Type your email first, then tap “Forgot password?”." });
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: SB_REDIRECT });
    setMsg(error ? { kind: "error", text: sbAuthText(error) } : { kind: "info", text: "Password reset email sent. Open the link in it to set a new password." });
  }

  return (
    <div className="auth">
      <div className="card auth-card">
        <div className="brand">
          <div className="brand-mark"><Icon name="brain" size={18} strokeWidth={2.2} /></div>
          <div><div className="brand-name">Second Brain</div><div className="brand-sub">Internship notebook</div></div>
        </div>
        <h1>{recovery ? "Set a new password" : mode === "signin" ? "Welcome back" : "Create your account"}</h1>
        <p className="lead">Your notes sync across desktop, iPad and phone.</p>
        <form className="auth-form" onSubmit={submit}>
          {!recovery && <label>Email<input type="email" autoComplete="email" required value={email} onChange={(e) => setEmail(e.target.value)} /></label>}
          <label>{recovery ? "New password" : "Password"}<input type="password" autoComplete={mode === "signin" && !recovery ? "current-password" : "new-password"} required minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} /></label>
          {msg && <div className={`auth-msg ${msg.kind}`}>{msg.text}{msg.action && <> <button type="button" className="linklike" onClick={msg.action.fn}>{msg.action.label}</button></>}</div>}
          <button className="btn primary" type="submit" disabled={busy}>{busy ? "Please wait…" : recovery ? "Save new password" : mode === "signin" ? "Sign in" : "Create account"}</button>
        </form>
        {!recovery && <div className="auth-switch">
          {mode === "signin"
            ? <>New here? <button className="linklike" onClick={() => { setMode("signup"); setMsg(null); }}>Create an account</button> · <button className="linklike" onClick={reset}>Forgot password?</button></>
            : <>Already have an account? <button className="linklike" onClick={() => { setMode("signin"); setMsg(null); }}>Sign in</button></>}
        </div>}
      </div>
    </div>
  );
}

function AuthScreen() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const auth = firebase.auth();
  const fail = (e) => { if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") setMsg({ kind: "error", text: AUTH_MESSAGES[e.code] || e.message }); };

  async function google() {
    setMsg(null); setBusy(true);
    const provider = new firebase.auth.GoogleAuthProvider();
    try { await auth.signInWithPopup(provider); }
    catch (e) {
      if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") await auth.signInWithRedirect(provider).catch(fail);
      else fail(e);
    } finally { setBusy(false); }
  }
  async function submit(e) {
    e.preventDefault(); setMsg(null); setBusy(true);
    try {
      if (mode === "signin") await auth.signInWithEmailAndPassword(email.trim(), password);
      else await auth.createUserWithEmailAndPassword(email.trim(), password);
    } catch (err) { fail(err); } finally { setBusy(false); }
  }
  async function reset() {
    if (!email.trim()) return setMsg({ kind: "error", text: "Type your email first, then tap “Forgot password”." });
    try { await auth.sendPasswordResetEmail(email.trim()); setMsg({ kind: "info", text: "Password reset email sent." }); } catch (e) { fail(e); }
  }

  return (
    <div className="auth">
      <div className="card auth-card">
        <div className="brand">
          <div className="brand-mark"><Icon name="brain" size={18} strokeWidth={2.2} /></div>
          <div><div className="brand-name">Second Brain</div><div className="brand-sub">Internship notebook</div></div>
        </div>
        <h1>{mode === "signin" ? "Welcome back" : "Create your account"}</h1>
        <p className="lead">Your notes sync across desktop, iPad and phone.</p>
        <button className="btn" style={{ width: "100%", height: 44 }} onClick={google} disabled={busy}>
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
          Continue with Google
        </button>
        <div className="divider">or with email</div>
        <form className="auth-form" onSubmit={submit}>
          <label>Email<input type="email" autoComplete="email" required value={email} onChange={(e) => setEmail(e.target.value)} /></label>
          <label>Password<input type="password" autoComplete={mode === "signin" ? "current-password" : "new-password"} required minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} /></label>
          {msg && <div className={`auth-msg ${msg.kind}`}>{msg.text}</div>}
          <button className="btn primary" type="submit" disabled={busy}>{busy ? "Please wait…" : mode === "signin" ? "Sign in" : "Create account"}</button>
        </form>
        <div className="auth-switch">
          {mode === "signin"
            ? <>New here? <button className="linklike" onClick={() => { setMode("signup"); setMsg(null); }}>Create an account</button> · <button className="linklike" onClick={reset}>Forgot password</button></>
            : <>Already have an account? <button className="linklike" onClick={() => { setMode("signin"); setMsg(null); }}>Sign in</button></>}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   17. APP ROOT — picks Supabase, Firebase, or demo (local) mode
   ============================================================ */
function App() {
  const [user, setUser] = useState(CLOUD_ENABLED ? undefined : null); // undefined = still checking
  // Supabase password-reset link — but never when the link carried an auth error (expired/invalid).
  const [recovery, setRecovery] = useState(SUPABASE_ENABLED && SB_RECOVERY_LINK && !SB_LINK_ERROR);
  useEffect(() => {
    if (SUPABASE_ENABLED) {
      let recoveryEvent = false; // PASSWORD_RECOVERY seen in this flow
      let hadSession = false;    // a session existed before any later SIGNED_IN (e.g. from a valid reset link)
      sb.auth.getSession().then(({ data }) => {
        if (data.session) hadSession = true;
        setUser((data.session && data.session.user) || null);
      }).catch(() => setUser(null));
      const { data } = sb.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") { recoveryEvent = true; setRecovery(true); }
        if (event === "SIGNED_OUT") { recoveryEvent = false; hadSession = false; setRecovery(false); }
        // A fresh normal sign-in (no prior session, no recovery event) is not a password reset.
        if (event === "SIGNED_IN" && !recoveryEvent && !hadSession) setRecovery(false);
        if (session && event !== "SIGNED_OUT") hadSession = true;
        setUser((session && session.user) || null);
      });
      return () => data.subscription.unsubscribe();
    }
    if (FIREBASE_ENABLED) return firebase.auth().onAuthStateChanged((u) => setUser(u));
  }, []);
  const userKey = user ? user.uid || user.id : null;
  const store = useMemo(() => (SUPABASE_ENABLED ? (user ? createSupabaseStore(sb, user) : null)
    : FIREBASE_ENABLED ? (user ? createFirebaseStore(user) : null) : createLocalStore()), [userKey]);

  if (CLOUD_ENABLED && user === undefined) return <div className="boot">Loading your notebook…</div>;
  if (SUPABASE_ENABLED && (!user || recovery)) return <SupabaseAuth recovery={Boolean(user && recovery)} onRecovered={() => setRecovery(false)} />;
  if (CLOUD_ENABLED && !user) return <AuthScreen />;
  return <Notebook key={userKey || "local"} store={store} user={user} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
